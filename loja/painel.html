<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel — Gohan Import</title><meta name="theme-color" content="#0b0f1a"><meta name="robots" content="noindex">
<link rel="icon" href="icon-192.png"><link rel="manifest" href="painel.webmanifest">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,Roboto,sans-serif;background:#0b0f1a;color:#eef;padding:14px;max-width:700px;margin:auto}
h1{font-size:20px;margin-bottom:4px}h1 span{color:#ff6a00}.sub{opacity:.6;font-size:13px;margin-bottom:14px}
.bx{background:#121829;border:1px solid #1f2842;border-radius:14px;padding:12px;margin-bottom:12px}
.bx h2{font-size:16px;margin-bottom:8px}
.cp{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #1e2640;font-size:14px}.cp:last-child{border:0}
.cp button,.btn{background:#1e2a4a;color:#fff;border:0;border-radius:9px;padding:8px 11px;font-weight:700;white-space:nowrap}
.big{width:100%;background:#ff6a00;color:#0b0f1a;border:0;border-radius:12px;padding:13px;font-weight:900;font-size:15px;margin-top:8px}
.forn{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.forn button{flex:1;border:0;border-radius:10px;padding:12px 6px;font-weight:900;color:#fff;font-size:14px}
.prod{font-size:15px;font-weight:800}.ok{background:#22c55e!important;color:#04210f!important}
textarea{width:100%;min-height:70px;background:#151c30;color:#fff;border:1px solid #2a3558;border-radius:10px;padding:10px;font-size:14px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#22c55e;color:#04210f;padding:10px 16px;border-radius:20px;font-weight:700;display:none}
.lista .cp{cursor:pointer}
</style></head><body>
<h1>Painel <span>Gohan Import</span></h1><div class="sub">Toque no link do pedido que chegou no WhatsApp e ele abre aqui.</div>
<div id="app"></div>
<div class="bx"><h2>Colar pedido</h2><textarea id="cola" placeholder="Cole aqui a mensagem do pedido do WhatsApp"></textarea><button class="big" onclick="colar()">Abrir pedido</button></div>
<div class="bx lista"><h2>Pedidos salvos neste celular</h2><div id="hist"></div></div>
<div id="toast"></div>
<script src="produtos.js"></script>
<script>
const R=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
let hist=JSON.parse(localStorage.gi_hist||'[]');
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1400)}
async function copia(t,msg){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast(msg||'Copiado!')}
function dec(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(decodeURIComponent(escape(atob(s))))}
function endereco(d){return `${d.nome}\n${d.rua}, ${d.num}${d.comp?' - '+d.comp:''}\n${d.bairro} - ${d.cidade}\nCEP ${d.cep}\nTel ${d.fone}${d.cpf?'\nCPF '+d.cpf:''}`}
let P=null;
function mostra(p){P=p;const d=p.d;if(!hist.find(h=>h.c===p.c)){hist.unshift({...p,st:{}});localStorage.gi_hist=JSON.stringify(hist.slice(0,200))}
const h=hist.find(x=>x.c===p.c);
const campos=[['Nome',d.nome],['WhatsApp',d.fone],['CPF',d.cpf],['CEP',d.cep],['Rua',d.rua],['Número',d.num],['Complemento',d.comp],['Bairro',d.bairro],['Cidade/UF',d.cidade]].filter(c=>c[1]);
document.getElementById('app').innerHTML=`<div class="bx"><h2>Pedido ${p.c} · ${R(p.t)}</h2>
${campos.map(c=>`<div class="cp"><span><small style="opacity:.6">${c[0]}</small><br>${c[1]}</span><button onclick="copia(${JSON.stringify(c[1]).replace(/"/g,'&quot;')},'${c[0]} copiado')">Copiar</button></div>`).join('')}
<button class="big" onclick="copia(endereco(P.d),'Endereço completo copiado')">📋 Copiar endereço completo</button>
<button class="big" style="background:#22c55e" onclick="whats()">💬 Mandar Pix / rastreio pro cliente</button></div>
${p.i.map(it=>{const pr=PRODUTOS.find(x=>x.id===it.id)||{nome:it.id,busca:it.id,emoji:'📦',preco:0};return `<div class="bx"><div class="prod">${pr.emoji} ${it.q}x ${pr.nome}</div>${pr.foto?`<img src="${pr.foto}" style="width:90px;height:90px;border-radius:10px;object-fit:cover;float:right;margin-left:8px">`:''}<small style="opacity:.75">Vendido: ${R(pr.preco*it.q)} · Custo aprox.: ${R((pr.custo||0)*it.q)} · <b style="color:#22c55e">Lucro aprox.: ${R((pr.preco-(pr.custo||0))*it.q)}</b><br>O endereço já vai copiado, é só colar na entrega e pagar. Escolha a mesma cor/modelo do pedido.</small>
${pr.fornecedor?`<button class="big" style="clear:both" onclick="comprarDireto('${it.id}')">🛒 Comprar este produto no AliExpress</button><small style="opacity:.6">Se acabar, use outro:</small>`:''}
<div class="forn">${FORNECEDORES.map((f,k)=>`<button style="background:${f.cor}" onclick="comprar('${it.id}',${k})">${f.nome}</button>`).join('')}</div>
<button class="btn ${h.st[it.id]?'ok':''}" style="margin-top:8px;width:100%" onclick="marca('${it.id}',this)">${h.st[it.id]?'✅ Comprado no fornecedor':'Marcar como comprado'}</button></div>`}).join('')}`;
scrollTo(0,0);lista()}
function comprar(id,k){const pr=PRODUTOS.find(x=>x.id===id);copia(endereco(P.d),'Endereço copiado! Cole na entrega do fornecedor');setTimeout(()=>window.open(FORNECEDORES[k].url(pr.busca),'_blank'),300)}
function comprarDireto(id){const pr=PRODUTOS.find(x=>x.id===id);copia(endereco(P.d),"Endereço copiado! Cole na entrega do AliExpress");setTimeout(()=>window.open(pr.fornecedor,"_blank"),300)}
function marca(id,b){const h=hist.find(x=>x.c===P.c);h.st[id]=!h.st[id];localStorage.gi_hist=JSON.stringify(hist);mostra(P)}
function whats(){const f=P.d.fone.replace(/\D/g,'');const n=f.length<=11?'55'+f:f;const m=`Olá ${P.d.nome.split(' ')[0]}! Aqui é da Gohan Import 😊\nRecebemos seu pedido ${P.c} de ${R(P.t)}.\nChave Pix: \n\nAssim que pagar, é só mandar o comprovante aqui. Depois te envio o código de rastreio.`;window.open('https://wa.me/'+n+'?text='+encodeURIComponent(m),'_blank')}
function colar(){const t=document.getElementById('cola').value;const m=t.match(/painel\.html#([A-Za-z0-9_-]+)/);if(!m){toast('Não achei o pedido nessa mensagem');return}try{mostra(dec(m[1]))}catch(e){toast('Pedido inválido')}}
function lista(){document.getElementById('hist').innerHTML=hist.length?hist.map((h,i)=>{const tudo=h.i.every(it=>h.st[it.id]);return `<div class="cp" onclick="mostra(hist[${i}])"><span>${tudo?'✅':'🟠'} ${h.c} · ${h.d.nome}</span><b>${R(h.t)}</b></div>`}).join(''):'<small style="opacity:.6">Nenhum pedido ainda.</small>'}
if(location.hash.length>5){try{mostra(dec(location.hash.slice(1)))}catch(e){toast('Pedido inválido')}}lista();
</script></body></html>
