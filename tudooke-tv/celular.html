<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TudoOkê - Galera</title><link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:radial-gradient(circle at 50% 0,#5b1aa8,#14002b 75%);color:#fff;min-height:100vh;padding:16px}
h1{margin:6px 0;font-size:26px;text-align:center}h1 span{color:#ffd54a}
#st{text-align:center;font-size:14px;opacity:.85;margin-bottom:10px}
.card{background:rgba(20,6,40,.85);border:2px solid #3b1a6e;border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:17px;color:#ffd54a}
input{width:100%;padding:13px;border-radius:10px;border:2px solid #7c3aed;background:#12052a;color:#fff;font-size:16px}
.figs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.figs button{font-size:30px;background:#1e0b3d;border:1px solid #3b1a6e;border-radius:12px;padding:8px 0}
.figs button:active{transform:scale(.9);background:#4a1d8a}
.btn{width:100%;margin-top:8px;padding:13px;border:none;border-radius:10px;background:#ff3fa4;color:#fff;font-weight:bold;font-size:16px}
.est{display:flex;justify-content:space-between}.est button{font-size:34px;background:none;border:none;filter:grayscale(1);opacity:.6}.est button.on{filter:none;opacity:1}
#ok{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#ff3fa4;padding:10px 18px;border-radius:20px;display:none;font-weight:bold}
#nota{display:none;text-align:center;font-size:20px}#nota b{font-size:48px;color:#ffd54a;display:block}
</style></head><body>
<h1>🎤 Tudo<span>Okê</span></h1>
<div id="st">Conectando na TV...</div>
<div class="card"><h2>Seu nome</h2><input id="nome" maxlength="14" placeholder="Ex.: Ana"></div>
<div class="card"><h2>Figurinhas na tela</h2><div class="figs" id="figs"></div></div>
<div class="card"><h2>Recado na tela</h2><input id="msg" maxlength="70" placeholder="Manda ver! 🔥"><button class="btn" id="bMsg">Enviar recado</button></div>
<div class="card"><h2>Vote em quem tá cantando</h2><div class="est" id="est"></div><button class="btn" id="bVoto">Votar</button></div>
<div class="card" id="nota">Nota final<b id="nN">--</b></div>
<div id="ok">Enviado! ✅</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
var tv=new URLSearchParams(location.search).get('tv')||'';
var $=function(i){return document.getElementById(i)},conn=null,estrela=0,ultimo=0;
$('nome').value=localStorage.tkNome||'';$('nome').oninput=function(){localStorage.tkNome=this.value};
['🔥','👏','😍','😂','🎤','⭐','💃','🍻','❤️','👑','🤘','😱'].forEach(function(f){var b=document.createElement('button');b.textContent=f;b.onclick=function(){manda({t:'fig',v:f})};$('figs').appendChild(b)});
for(var i=1;i<=5;i++)(function(n){var b=document.createElement('button');b.textContent='⭐';b.onclick=function(){estrela=n;[].forEach.call($('est').children,function(x,j){x.className=j<n?'on':''})};$('est').appendChild(b)})(i);
function ok(t){$('ok').textContent=t||'Enviado! ✅';$('ok').style.display='block';setTimeout(function(){$('ok').style.display='none'},1200)}
function manda(o){if(!conn||!conn.open){ok('Sem conexão com a TV');return}var a=Date.now();if(a-ultimo<700)return;ultimo=a;o.n=$('nome').value||'Alguém';conn.send(o);ok()}
$('bMsg').onclick=function(){var v=$('msg').value.trim();if(!v)return;manda({t:'msg',v:v});$('msg').value=''};
$('bVoto').onclick=function(){if(!estrela){ok('Escolha as estrelas');return}manda({t:'voto',v:estrela})};
if(!tv){$('st').textContent='Escaneie o QR code da TV pra entrar.'}else{
 var p=new Peer();
 function liga(){conn=p.connect('tudookeTV-'+tv,{reliable:true});
  conn.on('open',function(){$('st').textContent='✅ Conectado na TV (sala '+tv+')'});
  conn.on('data',function(d){if(d&&d.t==='ok'&&d.musica)$('st').textContent='✅ Conectado • Tocando: '+d.musica;if(d&&d.t==='nota'){$('nota').style.display='block';$('nN').textContent=d.v;estrela=0;[].forEach.call($('est').children,function(x){x.className=''})}});
  conn.on('close',function(){$('st').textContent='Reconectando...';setTimeout(liga,3000)});}
 p.on('open',liga);p.on('error',function(e){$('st').textContent='TV não encontrada. Confira se o app tá aberto na TV.';setTimeout(function(){try{liga()}catch(x){}},5000)});
}
</script></body></html>
