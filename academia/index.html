<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Projeto Z</title>
<meta name="theme-color" content="#0e0f12">
<meta name="description" content="Treino ABC, dieta e treinador no bolso.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#0e0f12;--card:#17191e;--card2:#1f2229;--line:#2a2d35;--tx:#f2f3f5;--mu:#9aa0aa;--or:#ff6a00;--rd:#e53935;--gr:#2ecc71;--bl:#29b6f6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
#app{max-width:560px;margin:0 auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:.2em 0}h2{font-size:1.5rem}
.muted{color:var(--mu)}.small{font-size:.85rem}.center{text-align:center}.block{display:block}.grow{flex:1;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.card.hot{border-color:var(--or);display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;align-items:center;padding:6px 2px}
.pill{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.8rem;color:var(--or);font-weight:600}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:1rem;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--or),var(--rd));cursor:pointer;margin-top:10px;text-align:center}
.btn.big{padding:18px;font-size:1.12rem}.btn.small{padding:9px 12px;font-size:.88rem;width:auto;display:inline-block;margin-top:6px}
.btn.ghost{background:var(--card2);border:1px solid var(--line);color:var(--tx)}
.btn.danger{background:#3a1416;color:#ff8a80;border:1px solid #5a1f22}
.btn:disabled{opacity:.35}.btn:active{transform:scale(.98)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid2 .card{margin:0}
label{display:block;margin:12px 0 6px;font-size:.9rem;color:var(--mu)}
input,select{width:100%;margin-top:6px;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:13px;font-size:1rem}
input[type=range]{padding:0;accent-color:var(--or)}
.chips-sel{display:flex;flex-wrap:wrap;gap:8px}
.opt{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px 14px;font-size:.95rem;flex:1 1 45%}
.opt.on{border-color:var(--or);background:#2b1a0e;color:#ffb27a;font-weight:700}
.hero{text-align:center;padding:8px 0 4px}.herologo{display:block;width:100%;max-width:340px;aspect-ratio:1;margin:0 auto -18px;border-radius:24px;-webkit-mask-image:radial-gradient(circle,#000 62%,transparent 72%);mask-image:radial-gradient(circle,#000 62%,transparent 72%)}.toplogo{width:46px;height:46px;border-radius:12px;vertical-align:middle;margin-right:10px}.hero .logo{font-size:3rem}.hero h1{background:linear-gradient(135deg,var(--or),var(--rd));-webkit-background-clip:text;background-clip:text;color:transparent;font-size:2rem}
.today{background:linear-gradient(160deg,#21160f,#17191e 60%);border-color:#3a2414}
.bigletter{font-size:2.6rem;font-weight:900;color:var(--or);line-height:1.1}
.sub{font-weight:600;margin-bottom:8px}
.exlist{display:flex;flex-wrap:wrap;gap:6px}.exlist span{background:var(--card2);border-radius:8px;padding:4px 8px;font-size:.78rem;color:var(--mu)}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dots{display:flex;gap:8px;margin:10px 0}.dots i{flex:1;height:10px;border-radius:6px;background:var(--card2)}.dots i.on{background:var(--or)}
.bar{height:10px;background:var(--card2);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--or),var(--rd));border-radius:6px;transition:width .3s}
.bar.water i{background:linear-gradient(90deg,#29b6f6,#0277bd)}
.mini small{color:var(--mu)}.mini b{display:block;font-size:1.4rem;margin-top:4px}.mini b span{font-size:.8rem;color:var(--mu);font-weight:500}
.hist{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.hist:last-child{border:0}
.lt{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--or);color:#fff;font-weight:900}
.exhead{display:flex;gap:12px;align-items:flex-start}.exhead b{display:block}
.vid{width:130px;aspect-ratio:3/2;object-fit:contain;background:#fff;border-radius:12px;flex-shrink:0;cursor:pointer}
.vid.sm{width:96px}.vid.xs{width:64px;border-radius:8px}.vid.lg{width:100%;max-height:300px;margin:10px 0}
.last{margin-top:6px;font-size:.85rem;color:#ffb27a;font-weight:600}
details{margin-top:10px}summary{cursor:pointer;color:var(--or);font-weight:600}details ul{margin:6px 0;padding-left:20px;color:#d6d8dc}
.sets{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.set{display:flex;gap:8px;align-items:center}.set span{width:30px;color:var(--mu);font-weight:700}.set input{margin:0;padding:12px 8px;text-align:center}
.chk{width:56px;height:48px;flex-shrink:0;border-radius:12px;border:2px solid var(--line);background:var(--card2);color:#fff;font-size:1.4rem;font-weight:900}
.set.ok .chk{background:var(--gr);border-color:var(--gr)}.set.ok input{border-color:#1f5c3a}
.tabs{display:flex;gap:8px;margin:10px 0}.tabs button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-weight:800;font-size:1rem}
.tabs button.on{background:var(--or);border-color:var(--or)}
.tag{background:#11324a;color:var(--bl);font-size:.7rem;padding:2px 6px;border-radius:6px}
.edit{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px}.edit label{margin:8px 0 0;font-size:.75rem}.edit input{padding:10px;margin-top:4px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.altbtn{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px;color:var(--tx);margin:6px 0;font-size:.95rem}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0;text-align:center}.kpis div{background:var(--card2);border-radius:12px;padding:10px 4px}.kpis b{display:block;font-size:1.05rem;color:var(--or)}.kpis small{color:var(--mu);font-size:.72rem}
.mac{margin:8px 0}
.cups{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.cup{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:1.3rem;filter:grayscale(1);opacity:.5}.cup.on{filter:none;opacity:1;border-color:var(--bl)}
.food{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.food .qty{display:flex;gap:4px}.food .qty .btn,.food .rm{margin:0;padding:8px 11px}
.addfood2{margin-top:10px}.addfood2>select{margin-top:0}
.qrow{display:flex;gap:6px;align-items:center;margin-top:8px}.qrow input{width:72px;flex:0 0 72px;margin:0;text-align:center;padding:12px 6px}.qrow select{flex:1;margin:0}.qrow .btn{width:auto;margin:0;padding:12px 16px;flex:0 0 auto}
#fprev{margin-top:6px}
.novid{display:flex;align-items:center;justify-content:center;font-size:2.2rem;background:var(--card2)!important;border:1px solid var(--line)}.vid.xs.novid{font-size:1.3rem}.vid.lg.novid{font-size:4rem;height:160px}
.msg.typing{opacity:.75;font-style:italic}
.total{padding-top:8px;font-weight:700}
.addfood{display:flex;gap:8px;align-items:center;margin-top:10px}.addfood select{flex:2}.addfood input{flex:1}.addfood .btn{width:auto;margin:6px 0 0;padding:13px 18px}
#chat{display:flex;flex-direction:column;gap:8px;padding:6px 0}
.msg{max-width:88%;padding:11px 14px;border-radius:16px;line-height:1.4;font-size:.97rem}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--or),var(--rd));border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg ul,.msg ol{padding-left:20px;margin:6px 0}
.msg.bot{position:relative;padding-right:40px}.say{position:absolute;top:6px;right:6px;background:var(--card2);border:1px solid var(--line);border-radius:999px;width:28px;height:28px;font-size:.8rem;line-height:1;padding:0;color:var(--tx)}.say.on{border-color:var(--or)}
.vhead{font-size:.8rem;font-weight:700;opacity:.9;margin-bottom:4px;display:flex;align-items:center;gap:6px}.vwave{letter-spacing:1px;opacity:.75}
.vbar{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.vtog.on{background:var(--rd);border-color:var(--rd);color:#fff}
.vtog{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:999px;padding:8px 12px;font-size:.82rem;font-weight:600}
.micbtn{width:48px;flex:0 0 48px;height:48px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--or),var(--rd));color:#fff;font-size:1.25rem;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.micbtn.on{background:var(--rd);animation:rpulse 1s infinite}
#recbar{position:fixed;left:12px;right:12px;bottom:calc(140px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;background:#1b1210;border:2px solid var(--rd);border-radius:18px;padding:10px 14px;display:none;z-index:40;box-shadow:0 10px 30px #000a}#recbar.show{display:block}
.rtop{display:flex;align-items:center;gap:10px}.rdot{width:12px;height:12px;border-radius:50%;background:var(--rd);animation:rpulse 1s infinite}.rtop b{color:var(--rd);font-variant-numeric:tabular-nums}.rhint{flex:1;color:var(--mu);font-size:.85rem}
.rbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--tx);font-size:1rem}.rbtn.send{background:var(--or);border:0}
.rlive{margin-top:6px;font-size:.92rem;max-height:30vh;overflow:auto}
@keyframes rpulse{0%{box-shadow:0 0 0 0 #e5393599}70%{box-shadow:0 0 0 12px #e5393500}100%{box-shadow:0 0 0 0 #e5393500}}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none}.chip{flex-shrink:0;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:999px;padding:9px 13px;font-size:.88rem}
.chatbar{display:flex;gap:8px;position:sticky;bottom:calc(80px + env(safe-area-inset-bottom));background:var(--bg);padding:6px 0}.chatbar input{margin:0}.chatbar .btn{width:auto;margin:0;padding:12px 16px}
#nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(14,15,18,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
#nav button{flex:1;background:none;border:0;color:var(--mu);font-size:.72rem;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}#nav button i{font-style:normal;font-size:1.35rem}#nav button.on{color:var(--or);font-weight:700}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:#fff;color:#111;padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90%;text-align:center}#toast.show{opacity:1;transform:translateX(-50%)}
#rest{position:fixed;inset:auto 12px calc(84px + env(safe-area-inset-bottom)) 12px;max-width:536px;margin:0 auto;background:#1b1210;border:2px solid var(--or);border-radius:18px;padding:12px 16px;display:none;align-items:center;gap:12px;z-index:30;box-shadow:0 10px 30px #000a}
#rest.show{display:flex}#rest-n{font-size:2rem;font-weight:900;color:var(--or);min-width:80px}#rest .btn{margin:0;width:auto;padding:10px 14px}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:50}#modal.show{display:flex}
#modal .sheet{background:var(--card);width:100%;max-width:560px;max-height:86vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
.mclose{float:right;background:var(--card2);border:0;color:var(--tx);border-radius:10px;width:40px;height:40px;font-size:1.1rem}
.filebtn{margin-top:10px;cursor:pointer}
.disclaimer{border-color:#4a3a14;background:#1d190f}
.hist2 summary{color:var(--tx);display:flex;align-items:center;gap:8px;padding:6px 0}
canvas{width:100%;height:auto;background:var(--card2);border-radius:12px;margin-top:8px}

</style>
</head>
<body>
<main id="app"></main>
<nav id="nav">
 <button data-tab="home"><i>🏠</i>Início</button>
 <button data-tab="treino"><i>🏋️</i>Treino</button>
 <button data-tab="comida"><i>🍽️</i>Comida</button>
 <button data-tab="coach"><i>💬</i>Treinador</button>
 <button data-tab="perfil"><i>👤</i>Perfil</button>
</nav>
<div id="rest"><div><small class="muted">Descanso</small><div id="rest-n">60s</div></div><div class="grow"></div><button class="btn ghost" id="rest-plus">+15s</button><button class="btn" id="rest-skip">Pular</button></div>
<div id="modal"><div class="sheet"><button class="mclose" aria-label="Fechar">✕</button><div id="modal-body"></div></div></div>
<div id="toast"></div>
<script>
// ===== EXERCÍCIOS (imagens: free-exercise-db, domínio público / Unlicense) =====
// g: grupo | eq: equipamento | lv: 1 fácil, 2 médio, 3 difícil | c: composto | pr: prioridade
const EX = [
// PEITO
{id:"Barbell_Bench_Press_-_Medium_Grip",n:"Supino reto com barra",g:"peito",eq:"barra",lv:2,c:1,pr:10,t:["Escápulas encaixadas e pés firmes no chão.","Desça a barra até a linha do peito, controlando.","Cotovelos a uns 45° do corpo, não totalmente abertos."]},
{id:"Barbell_Incline_Bench_Press_-_Medium_Grip",n:"Supino inclinado com barra",g:"peito",eq:"barra",lv:2,c:1,pr:9,t:["Banco entre 30° e 45°.","Desça a barra na parte alta do peito.","Não tire o quadril do banco."]},
{id:"Dumbbell_Bench_Press",n:"Supino reto com halteres",g:"peito",eq:"halter",lv:1,c:1,pr:9,t:["Desça os halteres até a linha do peito.","Suba juntando levemente os halteres, sem bater.","Mantenha os punhos retos."]},
{id:"Incline_Dumbbell_Press",n:"Supino inclinado com halteres",g:"peito",eq:"halter",lv:1,c:1,pr:9,t:["Banco a 30–45°.","Desça devagar sentindo alongar o peito.","Empurre para cima sem travar os cotovelos com força."]},
{id:"Dumbbell_Flyes",n:"Crucifixo reto com halteres",g:"peito",eq:"halter",lv:1,c:0,pr:6,t:["Cotovelos levemente flexionados o tempo todo.","Abra até sentir alongar, sem forçar o ombro.","Feche o movimento como se abraçasse uma árvore."]},
{id:"Butterfly",n:"Voador (peck deck)",g:"peito",eq:"máquina",lv:1,c:0,pr:7,t:["Ajuste o banco para as mãos ficarem na altura do peito.","Feche apertando o peito por 1 segundo.","Volte devagar, sem deixar o peso bater."]},
{id:"Cable_Crossover",n:"Crossover na polia",g:"peito",eq:"polia",lv:2,c:0,pr:6,t:["Um pé à frente e tronco levemente inclinado.","Traga as mãos para baixo e à frente, cruzando um pouco.","Controle a volta, sem deixar os braços irem muito para trás."]},
{id:"Machine_Bench_Press",n:"Supino na máquina",g:"peito",eq:"máquina",lv:1,c:1,pr:8,t:["Pegada na altura do meio do peito.","Costas apoiadas no encosto o tempo todo.","Empurre sem travar os cotovelos."]},
{id:"Pushups",n:"Flexão de braço",g:"peito",eq:"peso do corpo",lv:1,c:1,pr:5,t:["Corpo reto como uma prancha, abdômen firme.","Desça até o peito quase tocar o chão.","Se ficar pesado, apoie os joelhos."]},
{id:"Dips_-_Chest_Version",n:"Paralelas (foco no peito)",g:"peito",eq:"peso do corpo",lv:3,c:1,pr:5,t:["Incline o tronco à frente para focar o peito.","Desça só até o ombro ficar na linha do cotovelo.","Evite se tiver dor no ombro."]},
// COSTAS
{id:"Wide-Grip_Lat_Pulldown",n:"Puxada frontal aberta",g:"costas",eq:"polia",lv:1,c:1,pr:10,t:["Puxe a barra até a parte alta do peito.","Leve os cotovelos para baixo e para trás, peito aberto.","Não jogue o tronco para trás para roubar."]},
{id:"Close-Grip_Front_Lat_Pulldown",n:"Puxada frontal fechada",g:"costas",eq:"polia",lv:1,c:1,pr:8,t:["Pegada fechada, cotovelos perto do corpo.","Puxe até o peito, apertando as costas.","Suba controlando, alongando bem."]},
{id:"Bent_Over_Barbell_Row",n:"Remada curvada com barra",g:"costas",eq:"barra",lv:3,c:1,pr:9,t:["Coluna neutra, tronco inclinado uns 45°.","Puxe a barra em direção ao umbigo.","Joelhos levemente flexionados; não arredonde as costas."]},
{id:"One-Arm_Dumbbell_Row",n:"Remada unilateral (serrote)",g:"costas",eq:"halter",lv:1,c:1,pr:9,t:["Apoie mão e joelho no banco, costas retas.","Puxe o halter em direção ao quadril.","Não gire o tronco para subir o peso."]},
{id:"Seated_Cable_Rows",n:"Remada baixa sentada",g:"costas",eq:"polia",lv:1,c:1,pr:9,t:["Coluna reta, peito para frente.","Puxe o triângulo até o abdômen, juntando as escápulas.","Volte sem curvar as costas."]},
{id:"Pullups",n:"Barra fixa",g:"costas",eq:"peso do corpo",lv:3,c:1,pr:6,t:["Comece com braços estendidos e ombros encaixados.","Suba até o queixo passar a barra.","Se não conseguir, use o graviton ou elástico."]},
{id:"Straight-Arm_Pulldown",n:"Pulldown com braços estendidos",g:"costas",eq:"polia",lv:2,c:0,pr:5,t:["Braços quase retos o tempo todo.","Traga a barra até as coxas usando as costas.","Tronco levemente inclinado e abdômen firme."]},
{id:"T-Bar_Row_with_Handle",n:"Remada cavalinho",g:"costas",eq:"barra",lv:2,c:1,pr:7,t:["Coluna neutra e joelhos levemente flexionados.","Puxe até o peito/abdômen apertando as costas.","Desça controlando, sem arredondar a lombar."]},
{id:"Reverse_Grip_Bent-Over_Rows",n:"Remada curvada supinada",g:"costas",eq:"barra",lv:3,c:1,pr:6,t:["Palmas para cima, tronco inclinado.","Puxe a barra até a parte baixa do abdômen.","Mantenha a lombar neutra."]},
{id:"Hyperextensions_Back_Extensions",n:"Hiperextensão lombar (banco romano)",g:"costas",eq:"máquina",lv:1,c:0,pr:1,t:["Quadril apoiado na borda do banco.","Suba até o corpo ficar alinhado, sem hiperestender.","Movimento lento e controlado."]},
// OMBROS
{id:"Standing_Military_Press",n:"Desenvolvimento militar em pé",g:"ombro",eq:"barra",lv:3,c:1,pr:8,t:["Abdômen e glúteos contraídos.","Empurre a barra acima da cabeça em linha reta.","Não arqueie a lombar."]},
{id:"Seated_Dumbbell_Press",n:"Desenvolvimento sentado com halteres",g:"ombro",eq:"halter",lv:1,c:1,pr:10,t:["Costas apoiadas no banco.","Desça os halteres até a altura das orelhas.","Suba sem bater os halteres."]},
{id:"Dumbbell_Shoulder_Press",n:"Desenvolvimento com halteres",g:"ombro",eq:"halter",lv:2,c:1,pr:7,t:["Punhos alinhados com os cotovelos.","Suba até quase estender os braços.","Controle a descida."]},
{id:"Side_Lateral_Raise",n:"Elevação lateral",g:"ombro",eq:"halter",lv:1,c:0,pr:9,t:["Suba os braços até a altura dos ombros.","Cotovelos levemente flexionados, sem balançar o corpo.","Use peso leve e controle a descida."]},
{id:"Front_Dumbbell_Raise",n:"Elevação frontal",g:"ombro",eq:"halter",lv:1,c:0,pr:4,t:["Suba o halter até a altura dos olhos.","Sem impulso do tronco.","Desça devagar."]},
{id:"Reverse_Flyes",n:"Crucifixo invertido com halteres",g:"ombro",eq:"halter",lv:1,c:0,pr:6,sub:"post",t:["Tronco inclinado à frente, coluna reta.","Abra os braços para os lados apertando as escápulas.","Peso leve; foco no ombro de trás."]},
{id:"Face_Pull",n:"Face pull na polia",g:"ombro",eq:"polia",lv:2,c:0,pr:6,sub:"post",t:["Corda na altura do rosto.","Puxe em direção à testa abrindo os cotovelos.","Ótimo para a postura; use carga moderada."]},
{id:"Upright_Barbell_Row",n:"Remada alta com barra",g:"ombro",eq:"barra",lv:2,c:1,pr:4,t:["Pegada na largura dos ombros.","Suba a barra só até a altura do peito.","Se incomodar o ombro, troque por elevação lateral."]},

        pick=[...new Set(pick)]; }
      pick.forEach(e=>used.add(e.id));
      items.push(...pick.map(e=>Object.assign({id:e.id},prescribe(e.id,p.goal,p.level,false))));
    }
    // ordem: compostos de grupos grandes primeiro, abdômen no fim
    items.sort((a,b)=>(EXM[a.id].g==="abdomen")-(EXM[b.id].g==="abdomen") || (EXM[b.id].c-EXM[a.id].c) || big.indexOf(EXM[a.id].g)-big.indexOf(EXM[b.id].g));
    items.unshift({id:"Esteira_Aquecimento",warmup:true,sets:1,reps:"5–10 min",rest:0});
    items.push({id:"Esteira_Final",finisher:true,sets:1,reps:p.goal==="perder"?"20–30 min":"10–20 min",rest:0});
    plan.days[L]={nome:day.nome,items};
  }
  return plan;
}

// ===== RODÍZIO ABC =====
function nextLetter(){
  if(!S.plan) return null;
  const L=S.plan.letters; const last=[...S.history].reverse().find(h=>L.includes(h.letter));
  if(!last) return L[0];
  return L[(L.indexOf(last.letter)+1)%L.length];
}
function weekCount(){const ws=weekStart().getTime();return S.history.filter(h=>new Date(h.date).getTime()>=ws).length;}
function doneToday(){return S.history.some(h=>h.date.slice(0,10)===today()) ;}
function lastLoad(exId){
  for(let i=S.history.length-1;i>=0;i--){const ex=(S.history[i].ex||[]).find(x=>x.id===exId);
    if(ex){const sets=ex.sets.filter(s=>s.kg!==""&&s.kg!=null||s.reps); if(sets.length){const best=sets.reduce((a,b)=>(+b.kg||0)>(+a.kg||0)?b:a);return {kg:best.kg,reps:best.reps,date:S.history[i].date};}}}
  return null;
}
function shortVersion(L){
  const d=S.plan.days[L]; const it=d.items.filter(x=>!x.finisher&&!x.warmup&&EXM[x.id]&&EXM[x.id].g!=="abdomen"&&EXM[x.id].g!=="cardio");
  const main=it.slice(0,4).map(x=>Object.assign({},x,{sets:Math.max(2,x.sets-1),rest:Math.min(x.rest,45)}));
  const w=d.items.find(x=>x.warmup); return w?[Object.assign({},w,{reps:"5 min"}),...main]:main;
}

// ===== NUTRIÇÃO =====
function nutri(){
  const p=S.profile; if(!p) return null;
  const w=+p.weight, h=+p.height, a=+p.age;
  const bmr = 10*w + 6.25*h - 5*a + (p.sex==="F"?-161:5);
  const tdee = bmr*(ACT[p.activity]||ACT.moderado)[0];
  let kcal, protK, fatK, how;
  if(p.goal==="hipertrofia"){kcal=tdee+350;protK=2.0;fatK=1.0;how="+350 kcal acima da manutenção (superávit leve)";}
  else if(p.goal==="perder"){kcal=tdee-450;protK=2.2;fatK=0.8;how="−450 kcal abaixo da manutenção (déficit moderado)";}
  else {kcal=tdee*0.9;protK=2.0;fatK=0.9;how="−10% da manutenção (déficit leve para recompor)";}
  const floor=p.sex==="F"?1200:1500; if(kcal<floor){kcal=floor;}
  kcal=Math.round(kcal/10)*10;
  const prot=Math.round(w*protK), fat=Math.round(w*fatK);
  const carb=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  const trainDay = doneToday() || !!S.session || weekCount() < (+p.days||3);
  const water=Math.round(w*35 + (trainDay?500:0));
  return {bmr:r0(bmr),tdee:r0(tdee),kcal,prot,protK,fat,fatK,carb,water,trainDay,how,imc:(w/((h/100)**2))};
}
function dayFood(d=today()){ if(!S.food[d]) S.food[d]={cafe:[],almoco:[],lanche:[],jantar:[]}; return S.food[d]; }
function macrosOf(list){return list.reduce((t,it)=>{const f=FOODM[it.f];if(!f)return t;const k=it.g/100;t.k+=f.k*k;t.p+=f.p*k;t.c+=f.c*k;t.g+=f.g*k;return t;},{k:0,p:0,c:0,g:0});}
function dayTotals(d=today()){const df=dayFood(d);return macrosOf(Object.values(df).flat());}

function autoMenu(seed){
  const n=nutri(), R=rng(seed||Date.now()); const pick=a=>a[Math.floor(R()*a.length)];
  const protA=pick(["frango","patinho","tilapia","tambaqui"]), protJ=pick(["frango","tilapia","patinho","ovo"]);
  const carbA=pick(["arroz","arroz","macarrao"]), carbJ=pick(["macaxeira","batatadoce","arroz","cuscuz"]);
  const cafeC=pick(["paofrances","cuscuz","tapioca"]);
  // [food, gramas base, papel: P (proteína ajustável), C (carbo ajustável), F (fixo)]
  const m={
    cafe:[[cafeC,cafeC==="paofrances"?50:cafeC==="tapioca"?60:120,"C"],["ovo",100,"P"],["banana",70,"F"],["leite",200,"F"]],
    almoco:[[carbA,150,"C"],["feijao",100,"F"],[protA,120,"P"],["alface",30,"F"],["tomate",60,"F"]],
    lanche:[["iogurte",170,"F"],["aveia",30,"C"],[pick(["banana","mamao","maca"]),100,"F"],["whey",30,"P"]],
    jantar:[[carbJ,150,"C"],[protJ,120,"P"],["brocolis",80,"F"]]
  };
  let fP=1,fC=1,oil=5;
  const tot=()=>{let t={k:0,p:0,c:0,g:0};for(const ml in m)for(const [f,g,r] of m[ml]){const ff=FOODM[f],gg=g*(r==="P"?fP:r==="C"?fC:1)/100;t.k+=ff.k*gg;t.p+=ff.p*gg;t.c+=ff.c*gg;t.g+=ff.g*gg;}t.g+=oil*2;t.k+=oil*2*9;return t;};
  for(let i=0;i<40;i++){const t=tot();
    fP=Math.min(3,Math.max(0.4,fP*(1+0.5*(n.prot-t.p)/n.prot)));
    fC=Math.min(4,Math.max(0.3,fC*(1+0.5*(n.carb-t.c)/Math.max(n.carb,1))));
    oil=Math.min(15,Math.max(0,oil+(n.fat-t.g)/4));}
  const out={};
  for(const ml in m){out[ml]=m[ml].map(([f,g,r])=>toPortion(f,g*(r==="P"?fP:r==="C"?fC:1)));}
  const o=oil*2; if(o>=4){out.almoco.push(toPortion("azeite",o/2));out.jantar.push(toPortion("azeite",o/2));}
  return out;
}

async function askAI(acts){
  if(navigator.onLine===false) return null;
  const hist=S.chat.slice(-10).map(m=>({role:m.from==="me"?"user":"assistant",content:m.from==="me"?m.text:(m.text||htmlText(m.html))})).filter(m=>m.content);
  while(hist.length&&hist[0].role!=="user") hist.shift();
  const body=JSON.stringify({model:"openai",messages:[{role:"system",content:buildContext(acts)},...hist]});
  const wait=AI_LAST+46000-Date.now(); // limite grátis: ~1 resposta a cada 45 s por IP
  if(wait>0){AI_WAIT=true;if(TAB==="coach")render();await sleep(wait);}
  for(let attempt=0;attempt<2;attempt++){
    AI_LAST=Date.now(); try{localStorage.setItem("pz_ai_last",AI_LAST);}catch(e){}
    const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),30000);
    try{
      const r=await fetch(AI_URL,{method:"POST",headers:{"Content-Type":"application/json"},body,signal:ctl.signal});
      if(r.status===402||r.status===429){const ra=+r.headers.get("retry-after")||0;clearTimeout(to);if(attempt===0&&ra>0&&ra<=25){AI_WAIT=true;if(TAB==="coach")render();await sleep(ra*1000+600);continue;}return null;}
      if(!r.ok) return null;
      const txt=await r.text(); let out="";
      try{const j=JSON.parse(txt);out=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content||"";}catch(e){out="";}
      out=cleanAI(out); return out||null;
    }catch(e){return null;}finally{clearTimeout(to);}
  }
  return null;
}

    return {html:`${m[Math.floor(Math.random()*m.length)]}<br>Você já fez ${S.history.length} treino(s) aqui. ${weekCount()}/${p.days} nesta semana.<br><button class="btn small" data-act="short">Fazer versão curta agora</button>`};
  }
  if(has(nq,"aquec","alongar","alongamento")){ return {text:"Antes do treino: 5 min de esteira ou bike leve e 1–2 séries leves do primeiro exercício. Alongamento mais longo fica melhor no final do treino."}; }
  if(has(nq,"cardio","aerobic","correr","esteira")){ return {text:p.goal==="perder"?"Para perder gordura, o app coloca 15–20 min de cardio no fim de cada treino. Caminhar mais no dia a dia também ajuda muito!":"Cardio leve de 10–20 min, 2–3x por semana, faz bem para o coração e não atrapalha o ganho de massa se a comida estiver em dia."}; }
  if(has(nq,"oi ","ola","bom dia","boa tarde","boa noite","eai","e ai","salve","fala ")){ return {text:`Fala, ${first}! 👊 Bora? Posso te dizer o treino de hoje, sua proteína, água, ou ensinar um exercício.`}; }
  if(has(nq,"obrigad","valeu","vlw","tmj")){ return {text:"Tamo junto! 💪 Qualquer coisa é só chamar."}; }
  if(ex) return {html:`<b>${esc(ex.n)}</b> (${GRUPOS[ex.g]})${vid(ex.id,"vid lg")}<ul>${ex.t.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`};
  return {text:`Não entendi bem 😅. Estou sem conexão com a IA agora, então respondo no modo automático sobre: treino de hoje, versão curta, como fazer um exercício (ex.: "como fazer supino"), trocar exercício, proteína, água, calorias, cardápio, suplementos, descanso e motivação.`};
}

// ===== PERFIL / CONFIG =====
function viewPerfil(){
  const p=S.profile,n=nutri();
  return `<header class="top"><div><small class="muted">Perfil e ajustes</small><h2>${esc(p.name)}</h2></div></header>
  <div class="card"><b>Peso</b><canvas id="wchart" width="640" height="260"></canvas>
   <div class="addfood"><input id="wkg" type="number" step="0.1" inputmode="decimal" placeholder="Peso de hoje (kg)"><button class="btn" id="wadd">Registrar</button></div>
   <small class="muted block">${S.weights.length} registro(s) · IMC ${n.imc.toFixed(1).replace(".",",")}</small></div>
  <form id="pf" class="card"><b>Meus dados</b>${profileForm(p)}<button class="btn" type="submit">Salvar dados</button><small class="muted block">Mudou objetivo, foco, nível ou atividade? Depois de salvar, gere uma nova tabela.</small><button class="btn ghost" type="button" id="regen2">🔁 Salvar e gerar nova tabela</button></form>
  <div class="card"><b>Histórico de treinos (${S.history.length})</b>${S.history.length?S.history.slice().reverse().map((h,ri)=>{const i=S.history.length-1-ri;return `<details class="hist2"><summary><span class="lt">${h.letter}</span> ${fmtDate(h.date)} ${h.short?"· curta":""} ${h.dur?"· "+h.dur+" min":""}</summary><ul>${(h.ex||[]).filter(x=>x.sets.length).map(x=>`<li>${esc(EXM[x.id]?.n||x.id)}: ${x.sets.map(s=>`${s.kg?s.kg+"kg":""}${s.kg&&s.reps?"x":""}${s.reps||""}`).join(", ")}</li>`).join("")}</ul><button class="btn ghost small hdel" data-i="${i}">Apagar este treino</button></details>`;}).join(""):`<p class="muted">Vazio.</p>`}</div>
  <div class="card"><b>Backup</b><small class="muted block">Seus dados ficam só neste celular. Exporte para guardar ou passar para outro aparelho.</small>
   <div class="row2"><button class="btn" id="exp">⬇️ Exportar</button><label class="btn ghost filebtn">⬆️ Importar<input type="file" id="imp" accept="application/json,.json" hidden></label></div>
   <button class="btn danger" id="reset">Apagar tudo e recomeçar</button></div>
  <div class="card disclaimer"><b>Aviso importante</b><p class="small">O Projeto Z dá orientações gerais e automáticas. Ele <b>não substitui</b> médico, nutricionista ou educador físico. Antes de começar, especialmente se tiver alguma condição de saúde, consulte um profissional. Sentiu dor, tontura ou falta de ar, pare e procure ajuda.</p>
   <p class="small muted">Imagens dos exercícios: free-exercise-db (domínio público). Tabela de alimentos: valores aproximados baseados na TACO/Unicamp. O Treinador usa uma IA gratuita (Pollinations), que pode errar ou demorar; sem internet, responde por palavras-chave. Ao conversar com ele, suas mensagens e os dados do dia (perfil, metas, treino e refeições) são enviados para gerar a resposta.</p></div>`;
}
function drawChart(){
  const c=$("#wchart"); if(!c) return; const x=c.getContext("2d"),W=c.width,H=c.height; x.clearRect(0,0,W,H);
  const pts=S.weights.slice().sort((a,b)=>a.d<b.d?-1:1).slice(-30);
  x.fillStyle="#9aa0aa";x.font="22px system-ui";
  if(pts.length<2){x.fillText(pts.length?`${pts[0].kg} kg em ${pts[0].d.split("-").reverse().join("/")}`:"Sem registros",20,H/2);x.fillText("Registre mais pesos para ver o gráfico.",20,H/2+34);return;}
  const ks=pts.map(p=>+p.kg),mn=Math.min(...ks)-1,mx=Math.max(...ks)+1,L=60,R=20,T=20,B=40;
  const X=i=>L+(W-L-R)*i/(pts.length-1),Y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  x.strokeStyle="#2a2d35";x.lineWidth=1;for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4;x.beginPath();x.moveTo(L,Y(v));x.lineTo(W-R,Y(v));x.stroke();x.fillText(v.toFixed(1),4,Y(v)+7);}
  x.strokeStyle="#ff6a00";x.lineWidth=4;x.beginPath();pts.forEach((p,i)=>i?x.lineTo(X(i),Y(+p.kg)):x.moveTo(X(i),Y(+p.kg)));x.stroke();
  x.fillStyle="#ff6a00";pts.forEach((p,i)=>{x.beginPath();x.arc(X(i),Y(+p.kg),6,0,7);x.fill();});
  x.fillStyle="#9aa0aa";x.fillText(pts[0].d.slice(5).split("-").reverse().join("/"),L-10,H-8);const lt=pts[pts.length-1].d.slice(5).split("-").reverse().join("/");x.fillText(lt,W-R-x.measureText(lt).width,H-8);
}
function bindPerfil(){
  drawChart();
  $("#wadd").onclick=()=>{const kg=+String($("#wkg").value).replace(",",".");if(!kg||kg<30||kg>300){toast("Peso inválido");return;}S.weights=S.weights.filter(w=>w.d!==today());S.weights.push({d:today(),kg});S.profile.weight=kg;save();render();toast("Peso registrado");};
  const f=$("#pf"); bindProfileForm(f); $("#f-focus",f)._touched=true;
  const savep=()=>{const np=readProfileForm(f);if(!np.name||!np.age||!np.weight||!np.height){toast("Preencha todos os campos");return false;}S.profile=Object.assign(S.profile,np);if(!S.weights.length||S.weights[S.weights.length-1].kg!==np.weight){S.weights=S.weights.filter(w=>w.d!==today());S.weights.push({d:today(),kg:np.weight});}save();return true;};
  f.onsubmit=e=>{e.preventDefault();if(savep()){render();toast("Dados salvos");}};
  $("#regen2").onclick=()=>{if(savep()){S.seed=(S.seed*7+13)%100003;S.plan=generatePlan(S.seed);save();go("treino");toast("Nova tabela gerada!");}};
  $$(".hdel").forEach(b=>b.onclick=()=>{if(confirm("Apagar este treino do histórico?")){S.history.splice(+b.dataset.i,1);save();render();}});
  $("#exp").onclick=()=>{const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`maromba-backup-${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);};
  $("#imp").onchange=e=>{const file=e.target.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||!d.profile||!d.plan)throw 0;if(!confirm("Importar este backup? Os dados atuais serão substituídos."))return;S=migrate(Object.assign(DEF(),d));save();TAB="home";render();toast("Backup importado!");}catch(err){toast("Arquivo de backup inválido");}};rd.readAsText(file);};
  $("#reset").onclick=()=>{if(confirm("Apagar TODOS os dados deste app neste celular?")&&confirm("Tem certeza? Não dá para desfazer.")){localStorage.removeItem(KEY);S=DEF();TAB="home";render();}};
}
