<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Duelo dos Monstros</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e1b4b">
<link rel="icon" href="icon-192-v2.png">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;background:radial-gradient(circle at 50% 50%,#312e81,#0f0a2e);color:#fff;overflow:hidden}
button{border:0;border-radius:10px;padding:11px 14px;font-weight:800;font-size:15px;cursor:pointer;background:#fbbf24;color:#1e1b4b}
button.sec{background:#4c1d95;color:#fff}button.ver{background:#dc2626;color:#fff}button:disabled{opacity:.4}
input{font-size:18px;padding:10px;border-radius:10px;border:0;width:100%;text-align:center}
.esc{display:none!important}
#menu{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center}
#menu h1{font-size:34px;color:#fbbf24;text-shadow:0 3px 0 #7c2d12}
#menu .bx{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
#jogo{height:100%;display:flex;flex-direction:column;padding:4px;gap:3px;max-width:620px;margin:0 auto}
.barra{display:flex;align-items:center;gap:6px;font-size:12px;padding:2px 4px}
.barra .nome{font-weight:800;font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp{font-weight:900;font-size:18px;color:#fbbf24;min-width:70px;text-align:right}
.lpbar{height:5px;background:#333;border-radius:3px;overflow:hidden;margin:0 4px}.lpbar div{height:100%;background:linear-gradient(90deg,#22c55e,#fbbf24)}
.mini{background:rgba(255,255,255,.12);border-radius:6px;padding:2px 6px}
.linha{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.slot{aspect-ratio:3/4;border:1px dashed rgba(255,255,255,.25);border-radius:7px;position:relative;display:flex;align-items:center;justify-content:center}
.slot.st{aspect-ratio:3/2.3}
.carta{width:100%;height:100%;border-radius:7px;background:linear-gradient(160deg,#b45309,#78350f);border:2px solid #fbbf24;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:2px;overflow:hidden;position:relative;transition:transform .25s}
.carta.mag{background:linear-gradient(160deg,#047857,#064e3b);border-color:#6ee7b7}
.carta.arm{background:linear-gradient(160deg,#9d174d,#500724);border-color:#f9a8d4}
.carta.verso{background:repeating-linear-gradient(45deg,#4c1d95,#4c1d95 6px,#3b0764 6px,#3b0764 12px);border-color:#a78bfa}
.carta.verso::after{content:"✦";font-size:22px;color:#c4b5fd;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
.carta.def{transform:rotate(90deg) scale(.78)}
.carta .em{font-size:min(7vw,34px);line-height:1;flex:1;width:100%;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:4px;margin:1px 0}.carta .em img{width:100%;height:100%;object-fit:cover;border-radius:4px}
.carta .nm{font-size:min(2.1vw,10px);font-weight:800;text-align:center;line-height:1.05;max-height:2.2em;overflow:hidden}
.carta .st2{font-size:min(2.2vw,10px);font-weight:900;background:rgba(0,0,0,.45);border-radius:4px;padding:0 3px;white-space:nowrap}
.carta .lv{font-size:min(1.8vw,8px);color:#fde68a}
.carta.buff .st2{color:#86efac}
.sel{outline:3px solid #22d3ee;outline-offset:1px;border-radius:8px}
.alvo{animation:pis 0.8s infinite}
@keyframes pis{50%{outline:3px solid #f87171;outline-offset:2px;border-radius:8px}}
.usado{filter:brightness(.6)}
#mao{display:flex;gap:4px;overflow-x:auto;padding:4px 2px;min-height:calc(min(19vw,105px)*4/3 + 8px)}
#mao .mc{flex:0 0 min(19vw,105px);aspect-ratio:3/4}
#maoOp{display:flex;gap:2px;justify-content:center;height:22px}
#maoOp div{width:15px;height:21px;border-radius:3px;background:repeating-linear-gradient(45deg,#4c1d95,#4c1d95 3px,#3b0764 3px,#3b0764 6px);border:1px solid #a78bfa}
#meio{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:3px 2px}
#fase{font-weight:900;font-size:13px;color:#fde68a}
#meio button{padding:9px 12px;font-size:13px}
#toast{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.85);border:2px solid #fbbf24;padding:12px 18px;border-radius:12px;font-weight:900;font-size:17px;text-align:center;z-index:60;pointer-events:none;max-width:90vw;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
#modal>div{background:#1e1b4b;border:2px solid #fbbf24;border-radius:14px;padding:14px;width:100%;max-width:360px;max-height:92vh;overflow:auto;text-align:center}
#modal .grande{width:200px;height:280px;margin:0 auto 8px}
#modal .grande .em{font-size:64px}#modal .grande .nm{font-size:13px}#modal .grande .st2{font-size:13px}#modal .grande .lv{font-size:11px}
#modal p{font-size:14px;margin:6px 0;color:#ddd}
#modal .acoes{display:flex;flex-direction:column;gap:8px;margin-top:10px}
#aviso{font-size:12px;text-align:center;color:#a5b4fc;min-height:16px}
#topo{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;align-items:center;position:fixed;left:0;right:0;bottom:0;z-index:40;padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:rgba(17,24,39,.94);border-top:2px solid #fbbf24}
#topo button{padding:8px 11px;font-size:14px}
#jogo{padding-bottom:64px}
#escolha{position:fixed;inset:0;overflow:auto;padding:14px;background:radial-gradient(circle at 50% 30%,#312e81,#0f0a2e);z-index:40;text-align:center}
#persGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-width:440px;margin:10px auto}
.pers{background:rgba(255,255,255,.08);border:2px solid #a78bfa;border-radius:12px;padding:7px;cursor:pointer}.pers.sel{border-color:#fbbf24}
.pers img{width:100%;aspect-ratio:1;border-radius:8px;object-fit:cover;display:block}.pers b{display:block;color:#fbbf24;margin-top:4px;font-size:14px}.pers span{font-size:11px;color:#ddd;line-height:1.2;display:block}
.vid{width:120px;height:90px;border-radius:12px;object-fit:cover;border:2px solid #fbbf24;background:#000;flex:0 0 120px;transform:scaleX(-1);transition:all .2s}.vid.big{width:200px;height:150px;flex-basis:200px}.barra.comvid .av{display:none}#opVid{transform:none}
.av{width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid #fbbf24;flex:0 0 30px}
.hlA{outline:3px solid #f59e0b;outline-offset:2px;border-radius:8px;transform:scale(1.07);z-index:2}
.hlT{outline:3px solid #ef4444;outline-offset:2px;border-radius:8px;animation:pis .35s infinite}
.lp.hlT{color:#ef4444}
.carta .em .emj{font-size:min(9vw,40px)}
#nivBox button{opacity:.45}#nivBox button.on{opacity:1;outline:3px solid #fff}
#ptt{position:fixed;right:10px;bottom:calc(min(19vw,105px)*4/3 + 22px);width:58px;height:58px;border-radius:50%;padding:0;font-size:26px;background:#16a34a;color:#fff;z-index:30;touch-action:none;box-shadow:0 3px 10px rgba(0,0,0,.5)}
#gravInd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(min(19vw,105px)*4/3 + 34px);background:#991b1b;padding:8px 14px;border-radius:20px;z-index:31;font-weight:800;font-size:14px;white-space:nowrap;animation:pis 1s infinite}
#chatBt{position:fixed;right:10px;bottom:calc(min(19vw,105px)*4/3 + 22px);width:58px;height:58px;border-radius:50%;padding:0;font-size:26px;background:#16a34a;color:#fff;z-index:30;box-shadow:0 3px 10px rgba(0,0,0,.5)}#chatBt .n{position:absolute;top:-4px;right:-4px;background:#e01b24;color:#fff;border-radius:10px;font-size:12px;padding:1px 6px}#chatBox{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#111827;border-top:3px solid #fbbf24;padding:8px;display:flex;flex-direction:column;gap:6px;max-height:55vh}#chatLista{overflow-y:auto;display:flex;flex-direction:column;gap:4px;max-height:38vh}#chatLista .bolha{align-self:flex-start;font-size:14px}#chatLista .bolha.eu{align-self:flex-end}#chatLinha{display:flex;gap:6px}#chatIn{flex:1;padding:10px;border-radius:12px;border:0;font-size:16px}#chatLinha button{padding:10px 14px;border-radius:12px}
#bolhas{position:fixed;left:8px;bottom:calc(min(19vw,105px)*4/3 + 22px);display:flex;flex-direction:column;gap:4px;z-index:30;align-items:flex-start}
.bolha{background:#0f766e;color:#fff;padding:7px 11px;font-size:13px;border-radius:14px}.bolha.eu{background:#4c1d95}
.cod{font-size:42px;font-weight:900;letter-spacing:8px;color:#fbbf24}
#intro{position:fixed;inset:0;z-index:9999;background:#07020f;overflow:hidden;transition:opacity .9s}
#intro.sai{opacity:0;pointer-events:none}
#intro.espera *{animation-play-state:paused!important}
#introToque{position:absolute;left:0;right:0;top:50%;text-align:center;color:#fde68a;font-size:22px;font-weight:800;text-shadow:0 0 12px #f97316;animation:iPisca 1.1s ease-in-out infinite alternate!important;animation-play-state:running!important}
@keyframes iPisca{from{opacity:.35}to{opacity:1}}
#introStage{position:absolute;left:50%;top:44%;width:min(100vw,100vh*0.8,620px);aspect-ratio:1;transform:translate(-50%,-50%)}
#introDrag{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.25);animation:iDrag 6s ease-out forwards;-webkit-mask-image:radial-gradient(circle,#000 60%,transparent 72%);mask-image:radial-gradient(circle,#000 60%,transparent 72%)}
@keyframes iDrag{0%{opacity:0;transform:scale(1.3)}18%{opacity:1}100%{opacity:1;transform:scale(1.02)}}
#introStage.treme{animation:iTreme .5s linear 3}
@keyframes iTreme{0%,100%{margin:0}25%{margin:3px 0 0 -4px}50%{margin:-3px 0 0 3px}75%{margin:2px 0 0 -2px}}
#introFogo{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen}
.iCarta{position:absolute;width:30%;bottom:-45%;opacity:0;filter:drop-shadow(0 0 14px #38bdf8)}
#iC1{left:6%;animation:iC1 4.2s 1.8s cubic-bezier(.2,.7,.2,1) forwards}
#iC2{right:6%;animation:iC2 4.2s 2.1s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes iC1{0%{opacity:0;transform:translateY(0) rotate(-60deg) scale(.6)}40%{opacity:1}100%{opacity:1;transform:translateY(-118%) rotate(-14deg) scale(1)}}
@keyframes iC2{0%{opacity:0;transform:translateY(0) rotate(60deg) scale(.6)}40%{opacity:1}100%{opacity:1;transform:translateY(-118%) rotate(14deg) scale(1)}}
.iCarta.flut{animation:iFlut 2.4s ease-in-out infinite alternate}
#introTit{position:absolute;left:0;right:0;bottom:9%;text-align:center;font-size:clamp(28px,8vw,52px);font-weight:900;color:#fde68a;text-shadow:0 0 18px #f97316,0 0 40px #a855f7;opacity:0;transform:scale(1.6);letter-spacing:1px;animation:iTit 1.4s 3.6s ease-out forwards}
@keyframes iTit{to{opacity:1;transform:scale(1)}}
#introFlash{position:absolute;inset:0;background:#ffb347;opacity:0;pointer-events:none}
#introFlash.on{animation:iFl .8s ease-out}
@keyframes iFl{0%{opacity:.55}100%{opacity:0}}
#introPula{position:absolute;right:12px;top:12px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:6px 14px;font-size:14px;width:auto}

#fxL{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:900;overflow:hidden}
.fxM{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:12px;transition:transform .45s cubic-bezier(.2,1.4,.4,1),left .38s ease-in,top .38s ease-in,opacity .4s;filter:drop-shadow(0 6px 14px #000c) drop-shadow(0 0 12px #ffd54aaa)}
.fxM img{width:100%;height:100%;object-fit:cover;border-radius:12px;border:2px solid #ffd54a}
.fxM .emj{font-size:56px}
.fxM.ini{animation:fxSobe .9s ease-out}
@keyframes fxSobe{0%{opacity:0;transform:translateY(30px) scale(.3)}60%{opacity:1;transform:translateY(-10px) scale(1.1)}100%{transform:translateY(0) scale(1)}}
.fxM.mexe{animation:fxRuge .5s ease-in-out 2}
@keyframes fxRuge{0%,100%{rotate:0deg}25%{rotate:-7deg}75%{rotate:7deg}}
.fxBoom{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:radial-gradient(#fff,#ffd54a 30%,#ff6a00 60%,transparent 70%);animation:fxBoom .55s ease-out forwards}
@keyframes fxBoom{to{transform:scale(9);opacity:0}}
.fxCorte{position:absolute;font-size:60px;margin:-35px 0 0 -35px;animation:fxCorte .5s ease-out forwards}
@keyframes fxCorte{0%{transform:scale(.2) rotate(-40deg);opacity:0}40%{opacity:1;transform:scale(1.4) rotate(0)}100%{opacity:0;transform:scale(1.8)}}
.fxQ{position:absolute;overflow:hidden;border-radius:8px;animation:fxQuebra .8s ease-in forwards}
.fxQ img{width:100%;height:100%;object-fit:cover}
@keyframes fxQuebra{0%{filter:brightness(3) sepia(1) hue-rotate(-40deg)}30%{transform:scale(1.15) rotate(4deg)}100%{transform:scale(.2) rotate(-25deg) translateY(30px);opacity:0;filter:brightness(.3)}}
.fxRaio{position:absolute;height:8px;margin-top:-4px;transform-origin:0 50%;border-radius:4px;background:linear-gradient(90deg,#fff,#7dd3fc,#a78bfa);box-shadow:0 0 16px #7dd3fc;animation:fxRaio .5s ease-out forwards}
@keyframes fxRaio{0%{opacity:0;scale:0 1}30%{opacity:1;scale:1 1}100%{opacity:0;scale:1 1}}
.fxBrilho{position:absolute;font-size:26px;animation:fxBr 1s ease-out forwards}
@keyframes fxBr{to{transform:translate(var(--x),var(--y)) scale(.3);opacity:0}}
.fxTreme{animation:fxTr .35s}
@keyframes fxTr{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}

.fxM{perspective:420px}
.fxIn{width:100%;height:100%;display:flex;align-items:center;justify-content:center;transform-style:preserve-3d}
.fxIn.vivo{animation:fx3d 1.15s ease-in-out infinite}
@keyframes fx3dOLD{0%{transform:translateY(0) rotateY(-28deg) rotateX(6deg) scale(1)}18%{transform:translateY(-34px) rotateY(0deg) rotateX(-8deg) scale(1.08,.95)}32%{transform:translateY(0) rotateY(24deg) rotateX(4deg) scale(1.1,.88)}50%{transform:translateY(-14px) rotateY(32deg) rotateX(0) scale(1)}68%{transform:translateY(-40px) rotateY(0deg) rotateX(-10deg) scale(.96,1.06)}84%{transform:translateY(0) rotateY(-24deg) rotateX(5deg) scale(1.1,.88)}100%{transform:translateY(0) rotateY(-28deg) rotateX(6deg) scale(1)}}
.fxM.volta{transition:transform .55s ease-in,opacity .55s ease-in;transform:translateY(var(--vy)) scale(.15) rotateY(180deg)!important;opacity:0}
.fxSomb{position:absolute;height:12px;margin:-6px 0 0 0;border-radius:50%;background:radial-gradient(#000a,transparent 70%);animation:fxSo 1.15s ease-in-out infinite}
@keyframes fxSo{18%,68%{transform:scale(.6);opacity:.5}0%,32%,84%,100%{transform:scale(1);opacity:1}}
.fxM img.fig{object-fit:contain;border:0;border-radius:0;object-position:50% 100%}
.fxM:has(img.fig){filter:drop-shadow(0 4px 6px #000d) drop-shadow(0 0 8px #ffd54a88)}

.pup{position:relative;width:100%;height:100%}
.pup i{position:absolute;left:0;top:0;width:100%;height:100%;background-size:100% 100%;background-repeat:no-repeat}
.pup .pH{clip-path:inset(0 33% 75% 33%);transform-origin:50% 26%;animation:pH 1.15s ease-in-out infinite}
.pup .pT{clip-path:inset(23% 32% 35% 32%);transform-origin:50% 64%;animation:pT 1.15s ease-in-out infinite}
.pup .pAL{clip-path:inset(0 65% 35% 0);transform-origin:33% 27%;animation:pAL 1.15s ease-in-out infinite}
.pup .pAR{clip-path:inset(0 0 35% 65%);transform-origin:67% 27%;animation:pAR 1.15s ease-in-out infinite}
.pup .pLL{clip-path:inset(64% 49% 0 0);transform-origin:42% 64%;animation:pLL 1.15s ease-in-out infinite}
.pup .pLR{clip-path:inset(64% 0 0 49%);transform-origin:58% 64%;animation:pLR 1.15s ease-in-out infinite}
@keyframes pH{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(8deg) translateY(1px)}}
@keyframes pT{0%,100%{transform:scale(1)}50%{transform:scale(1.04,.97)}}
@keyframes pAL{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-26deg)}}
@keyframes pAR{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(18deg)}}
@keyframes pLL{0%,100%{transform:rotate(9deg)}50%{transform:rotate(-12deg)}}
@keyframes pLR{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(9deg)}}
.fxM.atk .pAR{animation:pGolpe .35s ease-in-out infinite}.fxM.atk .pAL{animation:pGolpe2 .35s ease-in-out infinite}
@keyframes pGolpe{0%,100%{transform:rotate(-55deg)}50%{transform:rotate(35deg)}}
@keyframes pGolpe2{0%,100%{transform:rotate(45deg)}50%{transform:rotate(-30deg)}}
.fxM.mag .pAL{animation:pMagL .5s ease-in-out infinite}.fxM.mag .pAR{animation:pMagR .5s ease-in-out infinite}
@keyframes pMagL{0%,100%{transform:rotate(30deg)}50%{transform:rotate(45deg)}}
@keyframes pMagR{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(-45deg)}}
.fxM.dor .fxIn{animation:pDor .25s 3}
@keyframes pDor{50%{transform:translateX(-8px) rotate(-10deg);filter:brightness(2) sepia(1) hue-rotate(-50deg)}}

@keyframes fx3d{0%,100%{transform:translateY(0) rotate(-4deg) scale(1,1)}15%{transform:translateY(0) rotate(0) scale(1.08,.9)}35%{transform:translateY(-30px) rotate(5deg) scale(.95,1.06)}55%{transform:translateY(0) rotate(0) scale(1.08,.9)}75%{transform:translateY(-16px) rotate(-6deg) scale(1)}}
.fxIn{transform-origin:50% 100%}
.fxM.atk .fxIn{animation:fxGolpe .3s ease-in-out infinite}
@keyframes fxGolpe{0%,100%{transform:rotate(-14deg) scale(1.05)}50%{transform:rotate(16deg) scale(1.12)}}
.fxM img.fig{width:100%;height:100%;object-fit:contain;image-rendering:auto}
.fxM{perspective:none}

.pp{position:relative;width:100%;height:100%}
.pp img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain}
.pp .b{-webkit-mask-image:linear-gradient(transparent 0,transparent 38%,#000 52%);mask-image:linear-gradient(transparent 0,transparent 38%,#000 52%);transform-origin:50% 100%;animation:ppB 1.4s ease-in-out infinite}
.pp .t{-webkit-mask-image:linear-gradient(#000 0,#000 52%,transparent 66%);mask-image:linear-gradient(#000 0,#000 52%,transparent 66%);transform-origin:50% 58%;animation:ppT 1.4s ease-in-out infinite}
@keyframes ppB{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
@keyframes ppT{0%,100%{transform:rotate(-5deg) translateY(0)}50%{transform:rotate(5deg) translateY(-4%)}}
.fxM.atk .pp .t{animation:ppGolpe .32s ease-in-out infinite}
.fxM.atk .pp .b{animation:ppPasso .32s ease-in-out infinite}
@keyframes ppGolpe{0%,100%{transform:rotate(-22deg) translateY(-3%)}55%{transform:rotate(24deg) translateY(2%) scale(1.06)}}
@keyframes ppPasso{0%,100%{transform:skewX(-6deg)}55%{transform:skewX(7deg) scale(1.03,.96)}}
.fxM.dor .pp .t{animation:ppDor .2s 4}
@keyframes ppDor{0%,100%{transform:rotate(0)}50%{transform:rotate(-16deg) translateX(-6%)}}
.fxM.mag::after{content:"";position:absolute;left:38%;top:12%;width:24%;height:24%;border-radius:50%;background:radial-gradient(circle,#fff 0,#9df 30%,rgba(60,120,255,.6) 55%,rgba(60,120,255,0) 72%);animation:orb .35s ease-in-out infinite;pointer-events:none}
.fxM.fogo::after{background:radial-gradient(circle,#fff 0,#ff6 25%,rgba(255,90,0,.75) 52%,rgba(255,40,0,0) 72%)}
@keyframes orb{0%{transform:scale(.6) translateY(0);opacity:.7}50%{transform:scale(1.5) translateY(-20%);opacity:1}100%{transform:scale(.6);opacity:.7}}
.fxIn.vivo{animation:fxPulo 1.4s ease-in-out infinite}
@keyframes fxPulo{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

.fimV{position:fixed;inset:0;z-index:2000;background:radial-gradient(circle at 50% 40%,#3b0764,#000 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;animation:fimEntra .4s ease-out}
.fimV.perdeu{background:radial-gradient(circle at 50% 40%,#1e293b,#000 75%)}
.fimV.sai{opacity:0;transition:opacity .4s}
@keyframes fimEntra{from{opacity:0;transform:scale(1.2)}to{opacity:1;transform:scale(1)}}

function bolhaAudio(url,quem,dur,tocar){ var b=document.createElement("button"); b.className="bolha"+(tocar?"":" eu"); b.innerText="🎤 "+quem+" "+fmtSeg(dur)+" ▶️"; var au=new Audio(url); au.onplay=function(){ b.innerText="🎤 "+quem+" "+fmtSeg(dur)+" 🔊"; }; au.onended=function(){ b.innerText="🎤 "+quem+" "+fmtSeg(dur)+" ▶️"; }; b.onclick=function(){ au.currentTime=0; au.play().catch(function(){}); }; bolhas.appendChild(b); while(bolhas.children.length>3) bolhas.removeChild(bolhas.firstChild); setTimeout(function(){ if(b.parentNode) b.parentNode.removeChild(b); },90000); if(tocar){ som("toque"); au.play().catch(function(){ toast("🎤 Áudio do amigo! Toque na bolha pra ouvir."); }); } }

var INTRO=null;
function introSom(n){ try{ var a=new Audio("img/intro_"+n+".mp3"); a.volume=1; var pr=a.play(); if(pr&&pr.catch) pr.catch(function(){}); return a; }catch(e){ return null; } }
function introPara(){ try{ if(INTRO){ (INTRO.sons||[]).forEach(function(a){ if(a){ a.pause(); } }); } }catch(e){} }
function introToque(){ var el=document.getElementById("intro"); if(!el) return; if(el.classList.contains("espera")){ el.classList.remove("espera"); var tq=document.getElementById("introToque"); if(tq) tq.remove(); introIni(); } else introFim(); }
function introFim(){ var el=document.getElementById("intro"); if(!el||el.classList.contains("sai")) return; el.classList.add("sai"); introPara(); clearTimeout(INTRO&&INTRO.to); clearTimeout(INTRO&&INTRO.tv); setTimeout(function(){ if(INTRO) INTRO.vivo=false; el.remove(); },950); }
function introIni(){ var el=document.getElementById("intro"); if(!el) return; var cv=document.getElementById("introFogo"), cx=cv.getContext("2d"), P=[], t0=performance.now(), MX=270, MY=318, foi=false; INTRO={vivo:true,sons:[]};
 function emit(n,forte){ for(var i=0;i<n;i++){ var a=Math.PI*0.62+(Math.random()-.5)*0.55, v=(forte?1.5:0.9)+Math.random()*1.2; P.push({x:MX+(Math.random()-.5)*14,y:MY+(Math.random()-.5)*10,vx:Math.cos(a)*v*0.55-0.25,vy:Math.sin(a)*v*0.9+0.15,r:6+Math.random()*10,g:0,vida:110+Math.random()*70}); } }
 function passo(ag){ if(!INTRO.vivo) return; var t=(ag-t0)/1000; cx.clearRect(0,0,600,600);
  if(t>1.3&&t<4.8){ if(!foi){ foi=true; INTRO.sons.push(introSom("fogo")); document.getElementById("introFlash").classList.add("on"); document.getElementById("introStage").classList.add("treme"); try{ if(navigator.vibrate) navigator.vibrate([60,40,90]); }catch(e){} } emit(t<1.8?9:6,t<1.8); }
  else if(t>=4.8&&t<5.6) emit(2);
  cx.globalCompositeOperation="lighter";
  for(var i=P.length-1;i>=0;i--){ var p=P[i]; p.x+=p.vx; p.y+=p.vy; p.vx*=0.995; p.r+=0.55; p.g++; var k=p.g/p.vida; if(k>=1){ P.splice(i,1); continue; }
   var al=(1-k)*0.5, gr=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r); gr.addColorStop(0,"rgba(255,255,220,"+al+")"); gr.addColorStop(0.35,"rgba(255,"+Math.floor(190-150*k)+",40,"+al*0.9+")"); gr.addColorStop(1,"rgba(160,20,0,0)"); cx.fillStyle=gr; cx.beginPath(); cx.arc(p.x,p.y,p.r,0,6.3); cx.fill(); }
  cx.globalCompositeOperation="source-over"; requestAnimationFrame(passo); }
 requestAnimationFrame(passo);
 setTimeout(function(){ ["iC1","iC2"].forEach(function(id,j){ var c=document.getElementById(id); if(c){ var tr=getComputedStyle(c).transform; c.style.transform=tr; c.style.opacity=1; c.style.animation="none"; c.animate([{transform:tr},{transform:tr+" translateY(-10px)"}],{duration:1600+j*300,direction:"alternate",iterations:Infinity,easing:"ease-in-out"}); } }); },6300);
 INTRO.tv=setTimeout(function(){ if(INTRO.vivo) INTRO.sons.push(introSom("hora")); },5000);
 INTRO.to=setTimeout(introFim,8400); }
