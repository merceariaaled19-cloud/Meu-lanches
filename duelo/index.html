 s1:{n:"Raio Divino",e:"⚡",t:"S",f:"raio",x:"Destrói TODOS os monstros do adversário."},
 s2:{n:"Buraco Negro Sombrio",e:"🕳️",t:"S",f:"buraco",x:"Destrói TODOS os monstros do campo, os seus também."},

 s7:{n:"Renascer do Monstro",e:"♻️",t:"S",f:"reborn",x:"Traz de volta o monstro mais forte de qualquer cemitério pro seu lado."},
 s8:{n:"Força Bélica",e:"💪",t:"S",f:"forca",x:"Um monstro seu ganha +700 de ataque."},

 t1:{n:"Força Espelhada",e:"🪞",t:"T",f:"espelho",x:"Quando o adversário atacar: destrói todos os monstros dele em posição de ataque."},
 t2:{n:"Cilindro Mágico",e:"🎩",t:"T",f:"cilindro",x:"Quando o adversário atacar: anula o ataque e ele leva o dano do próprio monstro."},

 t4:{n:"Anular Ataque",e:"🛡️",t:"T",f:"anular",x:"Quando o adversário atacar: anula o ataque e acaba a fase de batalha dele."}
};
var LISTA=["m1","m2","m3","m4","m5","m6","m7","m8","m9","m9","m10","m10","m11","m11","m12","m12","m13","m14","m15","m15","m16","m16","m17","m18","m18","m19","m20","m21","e1","e2","e3","e4","e5","s1","s2","s3","s4","s5","s6","s7","s8","s9","t1","t2","t3","t3","t4","t4"];
// ================= MOTOR =================
var S=null, UID=1;
function emb(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function novoDeck(){ var l=emb(LISTA.slice()).slice(0,40); return l.map(function(id){ return {u:UID++,id:id}; }); }
function novoP(nome){ return {nome:nome,lp:8000,deck:novoDeck(),hand:[],mz:[null,null,null,null,null],st:[null,null,null,null,null],gy:[]}; }
function novoJogo(n0,n1){ S={p:[novoP(n0),novoP(n1)],turn:Math.random()<.5?0:1,phase:"main",tn:1,normal:false,swords:[0,0],win:null,why:"",ev:[],evn:0}; for(var i=0;i<5;i++){ comprar(0); comprar(1); } ev("Duelo começou! "+S.p[S.turn].nome+" começa."); checar(); }
function ev(m){ S.evn++; S.ev.push({n:S.evn,m:m}); if(S.ev.length>8) S.ev.shift(); }
function comprar(p){ var P=S.p[p]; if(!P.deck.length){ fim(1-p,P.nome+" ficou sem cartas no deck!"); return; } P.hand.push(P.deck.pop()); }
function fim(w,why){ if(S.win!==null) return; S.win=w; S.why=why; ev(why); }
function checar(){ for(var p=0;p<2;p++){ var ids=S.p[p].hand.map(function(c){return c.id}); if(["e1","e2","e3","e4","e5"].every(function(x){return ids.indexOf(x)>=0})) fim(p,"EXÓDIO COMPLETO! "+S.p[p].nome+" venceu na hora!"); } for(p=0;p<2;p++) if(S.p[p].lp<=0){ S.p[p].lp=0; fim(1-p,S.p[p].nome+" ficou sem pontos de vida!"); } }
function atk(m){ return C[m.id].a+(m.buff||0); }
function destroiM(p,s){ var m=S.p[p].mz[s]; if(!m) return; S.p[p].gy.push({u:m.u,id:m.id}); S.p[p].mz[s]=null; }
function destroiST(p,s){ var c=S.p[p].st[s]; if(!c) return; S.p[p].gy.push({u:c.u,id:c.id}); S.p[p].st[s]=null; }
function livre(a){ return a.indexOf(null); }
function tribNec(id){ var l=C[id].lv; return l>=7?2:l>=5?1:0; }
function trapPronta(p,f){ var st=S.p[p].st; for(var i=0;i<5;i++){ var c=st[i]; if(c&&C[c.id].t==="T"&&C[c.id].f===f&&c.tn<S.tn) return i; } return -1; }
function iniciaTurno(p){ S.turn=p; S.phase="main"; S.normal=false; S.p[p].mz.forEach(function(m){ if(m){ m.at=false; m.ch=false; } }); if(S.tn>1) comprar(p); checar(); }
function act(pl,a){
 if(S.win!==null) return "O duelo acabou.";
 if(pl!==S.turn) return "Não é sua vez.";
 var P=S.p[pl], O=S.p[1-pl], o=1-pl;
 if(a.t==="summon"){
  if(S.phase!=="main") return "Só na fase principal.";
  if(S.normal) return "Você já invocou um monstro neste turno.";
  var c=P.hand[a.h]; if(!c||C[c.id].t!=="M") return "Carta inválida.";
  var n=tribNec(c.id), tr=a.tr||[]; if(tr.length!==n) return "Precisa sacrificar "+n+" monstro(s).";
  if(tr.some(function(s){return !P.mz[s]})) return "Sacrifício inválido.";
  if(!n&&livre(P.mz)<0) return "Campo cheio.";
  tr.forEach(function(s){ destroiM(pl,s); });
  P.hand.splice(a.h,1); var s=livre(P.mz); var m={u:c.u,id:c.id,pos:a.set?"def":"atk",down:!!a.set,tns:S.tn,at:false,ch:false}; P.mz[s]=m; S.normal=true;
  ev(a.set?P.nome+" baixou um monstro virado.":P.nome+" invocou "+C[c.id].n+"!");
  if(!a.set&&C[c.id].a>=1000){ var t=trapPronta(o,"armadilha"); if(t>=0){ ev("🪤 "+O.nome+" ativou Buraco Armadilha! "+C[c.id].n+" foi destruído."); destroiST(o,t); destroiM(pl,s); } }
  return null;
 }
 if(a.t==="setst"){
  if(S.phase!=="main") return "Só na fase principal.";
  var c2=P.hand[a.h]; if(!c2||C[c2.id].t==="M") return "Carta inválida."; var s2=livre(P.st); if(s2<0) return "Sem espaço pra magia/armadilha.";
  P.hand.splice(a.h,1); P.st[s2]={u:c2.u,id:c2.id,down:true,tn:S.tn}; ev(P.nome+" baixou uma carta virada."); return null;
 }
 if(a.t==="spell"){
  if(S.phase!=="main") return "Magia só na fase principal.";
  var card=a.h!=null?P.hand[a.h]:P.st[a.s]; if(!card||C[card.id].t!=="S") return "Carta inválida.";
  var f=C[card.id].f, err=podeMagia(pl,f,a.tg); if(err) return err;
  if(a.h!=null) P.hand.splice(a.h,1); else P.st[a.s]=null; P.gy.push({u:card.u,id:card.id});
  ev("✨ "+P.nome+" ativou "+C[card.id].n+"!");
  if(f==="raio") for(var i=0;i<5;i++) destroiM(o,i);
  if(f==="buraco") for(i=0;i<5;i++){ destroiM(0,i); destroiM(1,i); }
  if(f==="pote"){ comprar(pl); comprar(pl); }
  if(f==="pocao") P.lp+=1000;
  if(f==="fogo") O.lp-=800;
  if(f==="espadas"){ S.swords[pl]=3; O.mz.forEach(function(m){ if(m) m.down=false; }); }
  if(f==="forca") P.mz[a.tg].buff=(P.mz[a.tg].buff||0)+700;
  if(f==="pluma") for(i=0;i<5;i++) destroiST(o,i);
  if(f==="reborn"){ var b=melhorGy(); var G=S.p[b.p].gy[b.i]; S.p[b.p].gy.splice(b.i,1); P.mz[livre(P.mz)]={u:G.u,id:G.id,pos:"atk",down:false,tns:S.tn,at:false,ch:true}; ev(C[G.id].n+" voltou do cemitério!"); }
  checar(); return null;
 }
 if(a.t==="pos"){
  if(S.phase!=="main") return "Só na fase principal."; var m2=P.mz[a.m]; if(!m2) return "Sem monstro.";
  if(m2.tns===S.tn) return "Não pode mudar no turno em que entrou."; if(m2.ch||m2.at) return "Esse monstro já agiu neste turno.";
  if(m2.down){ m2.down=false; m2.pos="atk"; ev(P.nome+" virou "+C[m2.id].n+" pra cima!"); var t2=trapPronta(o,"armadilha"); }
  else { m2.pos=m2.pos==="atk"?"def":"atk"; ev(C[m2.id].n+" foi pra "+(m2.pos==="atk"?"ataque":"defesa")+"."); }
  m2.ch=true; return null;
 }
 if(a.t==="battle"){ if(S.phase!=="main") return "Já está na batalha."; if(S.tn===1) return "Quem começa não ataca no 1º turno."; S.phase="battle"; return null; }
 if(a.t==="attack"){
  if(S.phase!=="battle") return "Entre na fase de batalha primeiro."; var A=P.mz[a.m];
  if(!A||A.pos!=="atk"||A.down) return "Só monstro em ataque pode atacar."; if(A.at) return "Esse monstro já atacou.";
  if(S.swords[o]>0) return "As Espadas de Luz te impedem de atacar ("+S.swords[o]+" turnos).";
