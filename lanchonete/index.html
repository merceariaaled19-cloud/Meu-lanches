<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meu Lanche</title>
<meta name="description" content="Cardápio digital e pedidos pelo WhatsApp para lanchonetes.">
<meta name="theme-color" content="#ff6a00">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="estilo.css?v=2">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="confirma-sair.js?v=1"></script><script src="voltar-pergunta.js?v=2" data-nome="Meu Lanche Pro"></script>
</head>
<body>
<div id="raiz"><div class="hero"><div class="ico">🍔</div><p class="sub">Carregando…</p></div></div>
<div id="modal"></div>
<input type="file" id="arqCam" accept="image/*" capture="environment" class="esc">
<input type="file" id="arqGal" accept="image/*" class="esc">
<input type="file" id="arqCard" accept="image/*" multiple class="esc">
<input type="file" id="arqCardCam" accept="image/*" capture="environment" class="esc">
<script src="comum.js?v=9"></script>
<script src="loja.js?v=4"></script>
<script src="dono.js?v=12"></script>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  if (q.get('cad')) modoLogin = 'criar';
  if (q.get('l')) abreLoja(q.get('l')); else abreDono();
})();
/* Voltar do celular: fecha a janela aberta; no painel volta para a aba Pedidos; na tela inicial pergunta "Quer mesmo sair?" */
window.voltarDentro = function(){
  var m = document.getElementById('modal');
  if (m && m.innerHTML.trim()){ if (!voltaGenerico()) fechaModal(); return true; }
  if (typeof ABA !== 'undefined' && document.getElementById('conteudo') && document.getElementById('ab_pedidos') && ABA !== 'pedidos'){ vaiAba('pedidos'); return true; }
  if (typeof modoLogin !== 'undefined' && modoLogin === 'criar' && document.getElementById('lBt') && !/[?&]cad=/.test(location.search)){ modoLogin = 'entrar'; telaLogin(); return true; }
  return false;
};
</script>
</body>
</html>
