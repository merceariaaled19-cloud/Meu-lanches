name: Atualizar vagas Me Contrata
on:
  schedule:
    - cron: "0 10 * * *"   # todo dia 6h da manha em Manaus
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vagas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python me-contrata/buscar_vagas.py
      - run: |
          git config user.name "robo-vagas"
          git config user.email "actions@users.noreply.github.com"
          git add me-contrata/vagas.json
          git diff --cached --quiet || git commit -m "Vagas atualizadas $(date -u +%F)"
          git push
