name: TV Certa - testar canais
on:
  schedule:
    - cron: '30 3,9,15,21 * * *'   # 4x por dia (5h30 Manaus e a cada 6 h)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tv
  cancel-in-progress: false
jobs:
  canais:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar canais
        run: python3 tv/robo.py
      - name: Filmes e series (YouTube oficial)
        continue-on-error: true
        env:
          SINOPSES: '1'
        run: |
          pip install -q -U yt-dlp
          python3 tv/filmes.py
      - name: Salvar
        run: |
          git config user.name "merceariaaled19-cloud"
          git config user.email "merceariaaled19@gmail.com"
          git add tv/canais.json tv/filmes.json
          git diff --cached --quiet && exit 0
          git commit -m "TV Certa: canais e filmes atualizados"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
