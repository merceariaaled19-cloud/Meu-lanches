<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>TV Certa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,Roboto,sans-serif;background:#0f172a;color:#e2e8f0}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#020617;position:sticky;top:0;z-index:5}
header h1{font-size:19px;margin:0;flex:1}header h1 b{color:#e11d48}
.bt{background:#1e293b;color:#e2e8f0;border:0;border-radius:10px;padding:9px 12px;font-size:14px}
.bt.v{background:#e11d48;color:#fff}
#tela{position:sticky;top:52px;z-index:4;background:#000;display:none}
#tela.on{display:block}
video{width:100%;aspect-ratio:16/9;background:#000;display:block}
#barra{display:flex;gap:6px;align-items:center;padding:6px 8px;background:#020617;flex-wrap:wrap}
#barra .nome{flex:1;font-weight:600;font-size:15px;min-width:120px}
#msg{color:#fbbf24;font-size:13px;padding:0 10px 6px;background:#020617;display:none}
.busca{padding:10px 12px 0}
.busca input{width:100%;padding:11px 12px;border-radius:12px;border:1px solid #334155;background:#1e293b;color:#fff;font-size:15px}
#cats{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;scrollbar-width:none}
#cats button{white-space:nowrap;border:1px solid #334155;background:transparent;color:#cbd5e1;border-radius:20px;padding:7px 13px;font-size:14px}
#cats button.on{background:#e11d48;border-color:#e11d48;color:#fff}
#lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px;padding:4px 12px 90px}
.can{background:#1e293b;border-radius:12px;padding:8px;text-align:center;position:relative;border:2px solid transparent}
.can.on{border-color:#e11d48}
.can .lg{width:100%;aspect-ratio:16/10;background:#0f172a;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:22px;font-weight:700;color:#e11d48}
.can img{max-width:90%;max-height:90%;object-fit:contain}
.can .n{font-size:12.5px;margin-top:6px;line-height:1.2;height:31px;overflow:hidden}
.can .num{position:absolute;top:4px;left:6px;font-size:10px;color:#94a3b8}
.can .fav{position:absolute;top:2px;right:4px;font-size:17px;background:none;border:0;color:#64748b;padding:2px}
.can .fav.s{color:#facc15}
.vazio{grid-column:1/-1;text-align:center;color:#94a3b8;padding:30px 10px}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:20}
#modal.on{display:flex}
#caixa{background:#1e293b;width:100%;border-radius:18px 18px 0 0;padding:16px;max-height:88vh;overflow:auto}
#caixa h2{margin:0 0 8px;font-size:18px}
#caixa p{font-size:14px;color:#cbd5e1;margin:6px 0}
#caixa input[type=text],#caixa input[type=url]{width:100%;padding:11px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#fff;font-size:15px;margin:6px 0}
.lin{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.lst{background:#0f172a;border-radius:10px;padding:10px;margin:6px 0;display:flex;align-items:center;gap:8px;font-size:14px}
.lst span{flex:1}
small.av{display:block;color:#94a3b8;font-size:12px;text-align:center;padding:0 16px 20px}
</style>
</head>
<body>
<header>
  <h1>📺 TV <b>Certa</b></h1>
  <button class="bt" id="btListas">➕ Minha lista</button>
</header>
<div id="tela">
  <video id="v" controls playsinline autoplay></video>
  <div id="barra">
    <button class="bt" id="ant">⏮</button>
    <div class="nome" id="nomeAtual"></div>
    <button class="bt" id="prox">⏭</button>
    <button class="bt" id="cast" style="display:none">📡 TV</button>
    <button class="bt" id="cheia">⛶</button>
    <button class="bt" id="fechar">✕</button>
  </div>
  <div id="msg"></div>
</div>
<div class="busca"><input id="q" type="search" placeholder="🔎 Buscar canal"></div>
<div id="cats"></div>
<div id="lista"><div class="vazio">Carregando canais…</div></div>
<small class="av">Só canais com transmissão gratuita e aberta na internet, testados todo dia. Se um canal não abrir, ele pode estar fora do ar agora.</small>

<div id="modal"><div id="caixa">
  <h2>Minha lista (M3U)</h2>
  <p>Cole o link de uma lista M3U ou escolha o arquivo no celular. Use só listas que você tem direito de usar.</p>
  <input type="text" id="nomeLista" placeholder="Nome da lista (ex: Minha lista)">
  <input type="url" id="urlLista" placeholder="https://…/lista.m3u">
  <div class="lin">
    <button class="bt v" id="addUrl">Adicionar link</button>
    <label class="bt">📁 Escolher arquivo<input type="file" id="arq" accept=".m3u,.m3u8,audio/x-mpegurl,text/plain,*/*" hidden></label>
  </div>
  <p id="resLista"></p>
  <div id="minhas"></div>
  <div class="lin"><button class="bt" id="fecharModal">Fechar</button></div>
</div></div>

<script>
const $ = s => document.querySelector(s);
const V = $('#v');
let base = [], meus = [], todos = [], cat = 'Todos', atual = -1, hls = null, filtrados = [];
let favs = JSON.parse(localStorage.tvFavs || '[]');
let listas = JSON.parse(localStorage.tvListas || '[]');

function lerM3U(txt, nomeLista) {
  const out = []; let cur = null;
  txt.split(/\r?\n/).forEach(l => {
    l = l.trim();
    if (l.startsWith('#EXTINF')) {
      const g = /group-title="([^"]*)"/.exec(l), lg = /tvg-logo="([^"]*)"/.exec(l);
      cur = {nome: l.split(',').slice(1).join(',').trim() || 'Canal', logo: lg ? lg[1] : '', grupo: g ? g[1] : ''};
    } else if (l && !l.startsWith('#') && cur) {
      cur.url = l; cur.cat = nomeLista; out.push(cur); cur = null;
    }
  });
  return out;
}
function montar() {
  meus = [];
  listas.forEach(L => meus.push(...lerM3U(L.txt, L.nome)));
  todos = [...base, ...meus].map((c, i) => ({...c, id: c.url, num: i + 1}));
  const cs = ['Todos', '⭐ Favoritos', ...new Set(todos.map(c => c.cat))];
  if (!cs.includes(cat)) cat = 'Todos';
  $('#cats').innerHTML = cs.map(c => `<button class="${c === cat ? 'on' : ''}">${c}</button>`).join('');
  [...$('#cats').children].forEach(b => b.onclick = () => { cat = b.textContent; montar(); });
  desenhar();
}
function desenhar() {
  const q = $('#q').value.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  filtrados = todos.filter(c => (cat === 'Todos' || (cat === '⭐ Favoritos' ? favs.includes(c.id) : c.cat === cat))
    && (!q || c.nome.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').includes(q)));
  if (!filtrados.length) { $('#lista').innerHTML = `<div class="vazio">${cat === '⭐ Favoritos' ? 'Toque na ☆ de um canal pra salvar aqui.' : 'Nenhum canal encontrado.'}</div>`; return; }
  $('#lista').innerHTML = filtrados.map((c, i) => `<div class="can ${atual >= 0 && todos[atual] && todos[atual].id === c.id ? 'on' : ''}" data-i="${i}">
    <span class="num">${c.num}</span>
    <button class="fav ${favs.includes(c.id) ? 's' : ''}" data-f="${i}">${favs.includes(c.id) ? '★' : '☆'}</button>
    <div class="lg">${c.logo ? `<img loading="lazy" src="${c.logo}" alt="" onerror="this.replaceWith(document.createTextNode('${esc(c.nome[0] || 'T')}'))">` : esc(c.nome[0] || 'T')}</div>
    <div class="n">${esc(c.nome)}</div></div>`).join('');
}
function esc(s) { return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
$('#lista').onclick = e => {
  const f = e.target.closest('[data-f]');
  if (f) { const id = filtrados[f.dataset.f].id; favs = favs.includes(id) ? favs.filter(x => x !== id) : [...favs, id]; localStorage.tvFavs = JSON.stringify(favs); desenhar(); return; }
  const c = e.target.closest('.can'); if (c) tocar(todos.findIndex(t => t.id === filtrados[c.dataset.i].id));
};
$('#q').oninput = desenhar;

function aviso(t) { $('#msg').textContent = t; $('#msg').style.display = t ? 'block' : 'none'; }
function tocar(i) {
  if (i < 0 || i >= todos.length) return;
  atual = i; const c = todos[i];
  $('#tela').classList.add('on'); $('#nomeAtual').textContent = c.num + ' · ' + c.nome; aviso('Abrindo…');
  localStorage.tvUltimo = c.id;
  if (hls) { hls.destroy(); hls = null; }
  V.removeAttribute('src');
  if (c.url.startsWith('http:')) { aviso('Esse canal usa link sem segurança (http) e o celular bloqueia aqui dentro. Tente outro.'); desenhar(); return; }
  if (window.Hls && Hls.isSupported() && /\.m3u8|m3u8|\/hls\/|playlist/i.test(c.url)) {
    hls = new Hls({maxBufferLength: 20});
    hls.loadSource(c.url); hls.attachMedia(V);
    hls.on(Hls.Events.MANIFEST_PARSED, () => V.play().catch(() => {}));
    hls.on(Hls.Events.ERROR, (e, d) => { if (d.fatal) aviso('Esse canal não abriu agora. Pode estar fora do ar. Toque em ⏭ pra ir pro próximo.'); });
  } else { V.src = c.url; V.play().catch(() => {}); }
  desenhar(); window.scrollTo({top: 0, behavior: 'smooth'});
}
V.addEventListener('playing', () => aviso(''));
V.addEventListener('error', () => { if (!hls) aviso('Esse canal não abriu agora. Toque em ⏭ pra ir pro próximo.'); });
function pular(d) {
  if (!filtrados.length) return;
  let k = filtrados.findIndex(c => todos[atual] && c.id === todos[atual].id);
  k = (k + d + filtrados.length) % filtrados.length;
  tocar(todos.findIndex(t => t.id === filtrados[k].id));
}
$('#prox').onclick = () => pular(1); $('#ant').onclick = () => pular(-1);
$('#fechar').onclick = () => { if (hls) { hls.destroy(); hls = null; } V.pause(); V.removeAttribute('src'); V.load(); $('#tela').classList.remove('on'); atual = -1; desenhar(); };
$('#cheia').onclick = async () => {
  try { await (V.requestFullscreen ? V.requestFullscreen() : V.webkitEnterFullscreen()); if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch (e) {}
};
if (V.remote && V.remote.prompt) { $('#cast').style.display = ''; $('#cast').onclick = () => V.remote.prompt().catch(() => aviso('Nenhuma TV encontrada na mesma rede Wi-Fi.')); }

// Minha lista
function salvarListas() { try { localStorage.tvListas = JSON.stringify(listas); } catch (e) { alert('Lista muito grande pra guardar no celular.'); listas.pop(); } desenharListas(); montar(); }
function desenharListas() {
  $('#minhas').innerHTML = listas.length ? listas.map((L, i) => `<div class="lst"><span>📃 ${esc(L.nome)} (${lerM3U(L.txt, L.nome).length} canais)</span><button class="bt" data-x="${i}">Apagar</button></div>`).join('') : '<p>Nenhuma lista sua ainda.</p>';
  $('#minhas').querySelectorAll('[data-x]').forEach(b => b.onclick = () => { if (confirm('Apagar essa lista?')) { listas.splice(b.dataset.x, 1); salvarListas(); } });
}
function addTxt(txt) {
  const nome = ($('#nomeLista').value.trim() || 'Minha lista ' + (listas.length + 1));
  const n = lerM3U(txt, nome).length;
  if (!n) { $('#resLista').textContent = '❌ Não achei canais nessa lista. Confira se é uma M3U.'; return; }
  listas.push({nome, txt}); salvarListas();
  $('#resLista').textContent = `✅ ${n} canais adicionados em "${nome}".`; $('#urlLista').value = ''; $('#nomeLista').value = '';
}
$('#addUrl').onclick = async () => {
  const u = $('#urlLista').value.trim(); if (!u) return;
  $('#resLista').textContent = 'Baixando…';
  try { const r = await fetch(u); if (!r.ok) throw 0; addTxt(await r.text()); }
  catch (e) { $('#resLista').textContent = '❌ Não consegui baixar esse link daqui. Baixe o arquivo no celular e use "Escolher arquivo".'; }
};
$('#arq').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => addTxt(r.result); r.readAsText(f); e.target.value = ''; };
$('#btListas').onclick = () => { desenharListas(); $('#resLista').textContent = ''; $('#modal').classList.add('on'); };
$('#fecharModal').onclick = () => $('#modal').classList.remove('on');
$('#modal').onclick = e => { if (e.target.id === 'modal') $('#modal').classList.remove('on'); };

fetch('canais.json?' + Date.now()).then(r => r.json()).then(d => { base = d.canais; }).catch(() => {}).finally(() => {
  montar();
  if (!todos.length) $('#lista').innerHTML = '<div class="vazio">Sem internet pra carregar os canais.</div>';
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
