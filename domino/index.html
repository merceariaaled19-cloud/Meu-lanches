<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;background:radial-gradient(circle at 50% 40%,#312e81,#0f0a2e);color:#fff;overflow:hidden}
button{border:0;border-radius:12px;padding:12px 14px;font-weight:900;font-size:16px;cursor:pointer;background:#fbbf24;color:#1e1b4b;box-shadow:0 4px 0 #92400e}
button:active{transform:translateY(2px);box-shadow:0 2px 0 #92400e}
button.sec{background:#4c1d95;color:#fff;box-shadow:0 4px 0 #2e1065}
button.ver{background:#dc2626;color:#fff;box-shadow:0 4px 0 #7f1d1d}
button.vd{background:#16a34a;color:#fff;box-shadow:0 4px 0 #14532d}
input{font-size:18px;padding:11px;border-radius:12px;border:0;width:100%;text-align:center;font-weight:800}
.esc{display:none!important}
/* luzes */
#luzes{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#luzes i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(40px);opacity:.35;mix-blend-mode:screen}
#luzes i:nth-child(1){background:#ff0080;animation:l1 7s ease-in-out infinite alternate}
#luzes i:nth-child(2){background:#00d4ff;animation:l2 9s ease-in-out infinite alternate}
#luzes i:nth-child(3){background:#fbbf24;animation:l3 11s ease-in-out infinite alternate;opacity:.22}
@keyframes l1{from{left:-40vmax;top:-30vmax}to{left:40vw;top:30vh}}
@keyframes l2{from{right:-40vmax;bottom:-30vmax}to{right:40vw;bottom:40vh}}
@keyframes l3{from{left:30vw;top:60vh}to{left:-20vw;top:-20vh}}
body.festa #luzes i{animation-duration:.9s!important;opacity:.6}
.tela{position:relative;z-index:1;height:100%}
/* LEDs */
.leds{display:flex;justify-content:space-between;padding:0 6px;height:8px}
.leds b{width:7px;height:7px;border-radius:50%;background:#555;animation:led 1.2s infinite}
.leds b:nth-child(3n){animation-delay:.4s}.leds b:nth-child(3n+1){animation-delay:.8s}
@keyframes led{0%{background:#ff0040;box-shadow:0 0 8px #ff0040}33%{background:#fbbf24;box-shadow:0 0 8px #fbbf24}66%{background:#22d3ee;box-shadow:0 0 8px #22d3ee}100%{background:#ff0040;box-shadow:0 0 8px #ff0040}}
body.festa .leds b{animation-duration:.25s}
/* pedra */
.p{display:inline-flex;flex-direction:column;background:linear-gradient(145deg,#ffffff,#f1ead6);border-radius:calc(var(--s)*.22);border:2px solid #111;box-shadow:0 3px 4px rgba(0,0,0,.6);flex:none;position:relative}
.p.h{flex-direction:row}
.p .m{width:var(--s);height:var(--s);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:14%}
.p .m:first-child{border-bottom:2px solid #111}.p.h .m:first-child{border-bottom:0;border-right:2px solid #111}
.p .m i{border-radius:50%;margin:12%}.p .m i.d{background:#000;box-shadow:inset 0 -1px 0 #444}
.p.carroca .m i.d{background:#c81e1e}
.p.verso{background:repeating-linear-gradient(45deg,#4c1d95,#4c1d95 4px,#3b0764 4px,#3b0764 8px);border-color:#a78bfa}
.p.verso .m{border:0!important}
/* capa */
#capa{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 50% 45%,#4c1d95,#0f0a2e 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:opacity .6s}
#capa.sai{opacity:0;pointer-events:none}
#capa .raio{position:absolute;width:200vmax;height:200vmax;background:repeating-conic-gradient(rgba(251,191,36,.12) 0 10deg,transparent 10deg 20deg);animation:gira 18s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
#fila{display:flex;gap:10px;margin-bottom:26px;position:relative;z-index:2}
#fila .p{--s:26px;transform-origin:100% 100%;animation:cai 4.2s infinite}
@keyframes cai{0%,15%{transform:rotate(0)}25%,80%{transform:rotate(62deg)}95%,100%{transform:rotate(0)}}
#capa h1{position:relative;z-index:2;font-size:44px;line-height:1;text-align:center;color:#fbbf24;text-shadow:0 4px 0 #7c2d12,0 0 25px #f59e0b;animation:pulsa 1.4s ease-in-out infinite;letter-spacing:1px}
#capa h1 small{display:block;font-size:22px;color:#fff;text-shadow:0 0 12px #ff0080;letter-spacing:6px}
@keyframes pulsa{50%{transform:scale(1.07)}}
#capa .chuva{position:absolute;top:-80px;z-index:1;animation:chuva linear infinite}
@keyframes chuva{to{transform:translateY(120vh) rotate(720deg)}}
#btEntrar{position:relative;z-index:2;margin-top:34px;font-size:22px;padding:16px 46px;animation:pulsa 1s infinite;opacity:0;animation:aparece .6s 1.5s forwards,pulsa 1s 2.1s infinite}
@keyframes aparece{to{opacity:1}}
/* menu */
#menu{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center}
#menu h1{font-size:34px;color:#fbbf24;text-shadow:0 3px 0 #7c2d12,0 0 18px #f59e0b}
#menu .bx{width:100%;max-width:340px;display:flex;flex-direction:column;gap:11px}
#menu .cod{font-size:42px;font-weight:900;letter-spacing:8px;color:#fbbf24;text-shadow:0 0 14px #f59e0b}
/* jogo */
#jogo{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto;padding:4px 4px 8px}
.barra{display:flex;align-items:center;gap:8px;padding:5px 6px;background:rgba(0,0,0,.3);border-radius:10px}
.barra .nome{font-weight:900;font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra.vez{box-shadow:0 0 0 2px #fbbf24,0 0 16px #fbbf24}
.pt{font-weight:900;font-size:22px;color:#fbbf24;min-width:52px;text-align:right}
.pbar{height:6px;background:#333;border-radius:3px;overflow:hidden;margin:3px 4px 0}.pbar div{height:100%;background:linear-gradient(90deg,#22c55e,#fbbf24,#ef4444);transition:width .6s}
#maoOp{display:flex;gap:2px;justify-content:center;flex-wrap:wrap;padding:4px 0;min-height:30px}
#maoOp .p{--s:11px}
#mesaBox{flex:1;min-height:0;margin:4px 0;border-radius:16px;background:radial-gradient(circle,#166534,#052e16);border:4px solid #78350f;box-shadow:inset 0 0 30px #000,0 0 18px rgba(251,191,36,.35);display:flex;flex-direction:column;overflow:hidden;position:relative}
#mesa{flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:8px}
#mesa{touch-action:none}
#zb{transform-origin:50% 50%;display:flex;flex-direction:column;gap:6px;will-change:transform}
#zoomOk{position:absolute;right:8px;bottom:8px;z-index:3;padding:6px 10px;font-size:13px}
#mesa .lin{display:flex;align-items:center;gap:calc(var(--s)*.15);justify-content:flex-start}
#mesa .lin.inv{flex-direction:row-reverse}
#mesa .lin.so{justify-content:center}
#mesa .p{border-width:max(1px,calc(var(--s)*.08));box-shadow:0 3px 6px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.35)}
#mesa .p .m{padding:12%}
#mesa .p.ponta{box-shadow:0 0 0 2px #fbbf24,0 0 12px #fbbf24}
#mesa .p.nova{animation:nova .45s}
@keyframes nova{from{transform:scale(1.8) rotate(25deg);opacity:0}}
.info{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:4px 8px;background:rgba(0,0,0,.35);font-weight:800}
.info .soma{color:#fbbf24;font-size:15px}
#msg{text-align:center;font-weight:900;font-size:15px;min-height:22px;padding:3px;color:#fde68a}
#lados{display:flex;gap:10px;justify-content:center;padding:2px}
#lados button{flex:1;max-width:170px}
#mao{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:6px 2px;max-height:34vh;overflow:auto}
#mao .p{--s:25px;transition:transform .15s}
#mao .p.ok{box-shadow:0 0 0 2px #22c55e,0 0 12px #22c55e;cursor:pointer}
#mao .p.no{opacity:.45}
#mao .p.sel{transform:translateY(-10px);box-shadow:0 0 0 3px #fbbf24,0 0 18px #fbbf24}
.acoes{display:flex;gap:8px;justify-content:center;padding-top:4px}
.acoes button{padding:9px 12px;font-size:14px}
#pop{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:30;font-size:76px;font-weight:900;color:#fbbf24;text-shadow:0 0 20px #ff0080,0 5px 0 #7c2d12;pointer-events:none;opacity:0}
#pop.vai{animation:pop 1.3s}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}70%{opacity:1;transform:translate(-50%,-60%) scale(1)}100%{opacity:0;transform:translate(-50%,-90%) scale(.9)}}
#flash{position:fixed;inset:0;z-index:25;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(251,191,36,.5),rgba(255,0,128,.25))}
#flash.vai{animation:fl .7s}@keyframes fl{20%{opacity:1}}
#ov{position:fixed;inset:0;z-index:28;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:20px}
#ov .cx{background:linear-gradient(160deg,#4c1d95,#1e1b4b);border:3px solid #fbbf24;border-radius:20px;padding:22px;text-align:center;max-width:360px;width:100%;box-shadow:0 0 40px #f59e0b;display:flex;flex-direction:column;gap:12px}
#ov h2{color:#fbbf24;font-size:28px}
#ov p{font-size:16px;line-height:1.4}
#ov .regras{text-align:left;font-size:14px;max-height:55vh;overflow:auto}
.vid{width:58px;height:44px;object-fit:cover;border-radius:8px;border:2px solid #fbbf24;background:#000;flex:none;transform:scaleX(-1)}
.vid.big{position:fixed;z-index:27;width:46vw;height:35vw;max-width:260px;max-height:195px;border-width:3px;box-shadow:0 0 18px #000}
#opVid{transform:none}#opVid.big{left:8px;top:58px}#meVid.big{right:8px;bottom:120px;transform:scaleX(-1)}
#chatBox{position:fixed;left:6px;right:6px;bottom:70px;z-index:26;max-width:520px;margin:0 auto;background:rgba(20,10,50,.96);border:2px solid #fbbf24;border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px}
#chatLista{max-height:34vh;overflow:auto;display:flex;flex-direction:column;gap:5px;font-size:14px}
#chatLista .ms{background:#312e81;padding:6px 9px;border-radius:10px;align-self:flex-start;max-width:85%}
#chatLista .ms.eu{background:#166534;align-self:flex-end}
#chatLista audio{height:34px;max-width:220px}
#chatLinha{display:flex;gap:5px}#chatLinha input{font-size:15px;padding:8px;text-align:left}#chatLinha button{padding:8px 10px;font-size:15px}
#btGrava.rec{background:#dc2626;color:#fff;animation:pulsa .6s infinite}
#chatN{background:#dc2626;color:#fff;border-radius:9px;padding:0 5px;font-size:11px;margin-left:2px}
#avisoMsg{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:29;background:#4c1d95;border:2px solid #fbbf24;border-radius:12px;padding:7px 12px;font-weight:800;max-width:90vw}
.mini{background:rgba(0,0,0,.4);color:#fff;box-shadow:none;padding:6px 8px;font-size:15px;border-radius:9px}
.lnk{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#som{position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:21;background:rgba(0,0,0,.4);color:#fff;box-shadow:none;padding:6px 9px;font-size:18px}
</style>
</head>
<body>
<div id="luzes"><i></i><i></i><i></i></div>
<button id="som" onclick="mudo=!mudo;this.textContent=mudo?'🔇':'🔊'">🔊</button>

<div id="capa">
  <div class="raio"></div>
  <div id="fila"></div>
  <h1>DUELO DO<br>DOMINÓ<small>100 PONTOS</small></h1>
  <button id="btEntrar" onclick="entrar()">▶ JOGAR</button>
</div>

<div id="menu" class="tela esc">
  <h1>🎲 Duelo do Dominó</h1>
  <div class="bx" id="m1">
    <input id="nome" maxlength="14" placeholder="Seu nome">
    <button onclick="mostra('m4')">🤖 Jogar offline (contra o robô)</button>

    <button class="ver" onclick="regras()">📜 Regras</button>
  </div>

    <p style="font-weight:900;font-size:18px;color:#fbbf24">Escolha o nível do robô</p>

    <p id="stSala">Esperando o amigo entrar...</p>
    <button class="sec" onclick="volta()">Cancelar</button>

</div>

<div id="jogo" class="tela esc">
  <div class="leds" id="leds1"></div>
  <div class="barra" id="bOp"><video id="opVid" class="vid esc" autoplay playsinline onclick="this.classList.toggle('big')"></video><span class="nome" id="nOp">Robô</span><span id="cOp" style="font-size:12px"></span><span class="pt" id="pOp">0</span></div>
  <div class="pbar"><div id="gOp" style="width:0"></div></div>
  <div id="maoOp"></div>
  <div id="mesaBox">
    <div class="info"><span id="dorme">Dorme: 14</span><span class="soma" id="soma">Pontas: -</span><span id="rod">Rodada 1</span></div>
    <div id="mesa"></div><button class="sec esc" id="zoomOk" onclick="zeraZoom()">🔍 Tamanho normal</button>
  </div>
  <div id="msg"></div>
  <div id="lados" class="esc"><button class="vd" id="btL" onclick="joga('L')">◀ Esquerda</button><button class="vd" id="btR" onclick="joga('R')">Direita ▶</button></div>
  <div id="mao"></div>
  <div class="barra" id="bEu"><video id="meVid" class="vid esc" autoplay playsinline muted onclick="this.classList.toggle('big')"></video><span class="nome" id="nEu">Você</span><span class="pt" id="pEu">0</span></div>
  <div class="pbar"><div id="gEu" style="width:0"></div></div>
  <div class="acoes">
    <button class="vd esc" id="btCompra" onclick="pede({t:'c'})">🂠 Comprar</button>
    <button class="ver esc" id="btPassa" onclick="pede({t:'p'})">Passar a vez</button>
    <button class="mini esc" id="btMic" onclick="tMic()">🎤</button><button class="mini esc" id="btCam" onclick="tCam()">📷</button><button class="mini esc" id="btOuvir" onclick="ouvir()">🔈 Ouvir</button><button class="mini esc" id="btChat" onclick="abreChat()">💬<span id="chatN" class="esc">0</span></button>
    <button class="sec" onclick="pedeSair()">Sair</button>

<div id="pop"></div><div id="flash"></div>

<div id="chatBox" class="esc"><div id="chatLista"></div><div id="chatLinha"><input id="chatIn" maxlength="140" placeholder="Escreva..." enterkeyhint="send" onkeydown="if(event.key==='Enter')mandaMsg()"><button onclick="mandaMsg()">➤</button><button id="btGrava" class="vd">🎤</button><button class="sec" onclick="fechaChat()">✖</button></div><small style="opacity:.7;text-align:center">Segure 🎤 pra gravar áudio, solte pra enviar</small></div>

<script>
const $=id=>document.getElementById(id);
var ICE={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun.relay.metered.ca:80"},{urls:"turn:global.relay.metered.ca:80",username:"6dff73deecf7b62d9ae1759e",credential:"7J1gl21x+BQziEO1"},{urls:"turn:global.relay.metered.ca:80?transport=tcp",username:"6dff73deecf7b62d9ae1759e",credential:"7J1gl21x+BQziEO1"},{urls:"turn:global.relay.metered.ca:443",username:"6dff73deecf7b62d9ae1759e",credential:"7J1gl21x+BQziEO1"},{urls:"turns:global.relay.metered.ca:443?transport=tcp",username:"6dff73deecf7b62d9ae1759e",credential:"7J1gl21x+BQziEO1"}]};
const META=100;
let nivel=1,S=null,me=0,modo='cpu',peer=null,conn=null,sel=-1,ultEv=0,mudo=false,cpuT=null;

/* ---------- SOM ---------- */
let AC=null;
function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();return AC}
function tom(f,d,tp,v,t0,f2){if(mudo)return;try{const a=ac(),t=a.currentTime+(t0||0),o=a.createOscillator(),g=a.createGain();o.type=tp||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function ruido(d,v,t0,fq){if(mudo)return;try{const a=ac(),t=a.currentTime+(t0||0),n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=fq||2500;f.Q.value=1.2;g.gain.value=v||.5;s.connect(f).connect(g).connect(a.destination);s.start(t)}catch(e){}}
const SFX={
 clack(){ruido(.07,.9,0,3200);ruido(.05,.5,.035,1400);tom(180,.06,'triangle',.15)},
 toque(){tom(900,.05,'sine',.08)},
 ponto(p){const n=[523,659,784,1047,1319];n.forEach((f,i)=>tom(f,.2,'square',.1,i*.07));tom(1568,.5,'triangle',.12,.36);if(p>=20)[0,.1,.2].forEach(t=>ruido(.15,.4,.5+t,6000))},
 compra(){ruido(.1,.4,0,900);ruido(.1,.4,.12,1100);ruido(.1,.4,.24,1300)},
 passa(){tom(220,.25,'sawtooth',.1,0,110)},
 rodada(){[392,523,659,784].forEach((f,i)=>tom(f,.25,'square',.1,i*.12));for(let i=0;i<8;i++)ruido(.08,.5,i*.06,180)},
 vitoria(){const n=[523,523,523,659,784,659,784,1047];n.forEach((f,i)=>tom(f,.22,'square',.12,i*.15));tom(1047,1,'triangle',.12,1.2);for(let i=0;i<14;i++)ruido(.1,.35,1.2+i*.07,5000+Math.random()*3000)},
 derrota(){[392,370,349,330].forEach((f,i)=>tom(f,.4,'sawtooth',.09,i*.3))},
 intro(){for(let i=0;i<6;i++){ruido(.12,.9,i*.13,160);tom(70,.15,'sine',.4,i*.13,40)}tom(200,1.2,'sawtooth',.08,.2,1200);[523,659,784,1047].forEach((f,i)=>tom(f,.3,'square',.1,.9+i*.1));for(let i=0;i<8;i++)ruido(.06,.5,1.4+i*.05,3000)}
};
function vib(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

/* ---------- PEDRAS ---------- */
const PIPS={0:[],1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,3,6,2,5,8]};
function meia(n){let h='<div class="m">';for(let i=0;i<9;i++)h+='<i class="'+(PIPS[n].includes(i)?'d':'')+'"></i>';return h+'</div>'}
function pedra(a,b,hor,extra){return '<div class="p'+(hor?' h':'')+(a==b?' carroca':'')+(extra?' '+extra:'')+'">'+meia(a)+meia(b)+'</div>'}

/* ---------- REGRAS DO JOGO ---------- */
function embaralha(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function somaMao(h){return h.reduce((s,t)=>s+t[0]+t[1],0)}
function pontas(){if(!S.ch.length)return null;return[S.ch[0][0],S.ch[S.ch.length-1][1]]}
function somaPontas(){const c=S.ch;if(!c.length)return 0;if(c.length==1)return c[0][0]+c[0][1];const l=c[0],r=c[c.length-1];return(l[0]==l[1]?2*l[0]:l[0])+(r[0]==r[1]?2*r[1]:r[1])}
function lados(t){if(!S.ch.length)return['L'];const[L,R]=pontas(),o=[];if(t[0]==L||t[1]==L)o.push('L');if(t[0]==R||t[1]==R)o.push('R');return o}
function podeJogar(s){return S.h[s].some(t=>lados(t).length)}
function ev(k,s,pts){S.ev={id:(S.ev?S.ev.id:0)+1,k,s,pts:pts||0}}
function novoJogo(n0,n1){S={nomes:[n0,n1],sc:[0,0],rd:0,win:-1,ev:null};novaRodada()}
function novaRodada(){try{zeraZoom()}catch(e){}const p=[];for(let a=0;a<=6;a++)for(let b=a;b<=6;b++)p.push([a,b]);embaralha(p);
 S.h=[p.splice(0,7),p.splice(0,7)];S.pile=p;S.ch=[];S.pass=0;S.rd++;S.falta=[[],[]];S.fim=null;S.acabou=-1;S.nova=-1;
 if(S.win<0){let best=-1,bs=0,bi=0;for(const s of[0,1])S.h[s].forEach((t,i)=>{const v=t[0]==t[1]?100+t[0]:t[0]+t[1];if(v>best){best=v;bs=s;bi=i}});
   const t=S.h[bs][bi];S.vez=bs;jogar(bs,bi,'L');S.msg=S.nomes[bs]+' saiu com '+(t[0]==t[1]?'a carroça de '+t[0]:t[0]+'-'+t[1]);}
 else{S.vez=S.win;S.msg=S.nomes[S.win]+' começa a rodada';ev('rodada',S.win)}}
function jogar(s,i,lado){const t=S.h[s].splice(i,1)[0];
 if(!S.ch.length)S.ch.push(t);
 else if(lado=='L'){const L=S.ch[0][0];S.ch.unshift(t[1]==L?[t[0],t[1]]:[t[1],t[0]]);S.nova=0}
 else{const R=S.ch[S.ch.length-1][1];S.ch.push(t[0]==R?[t[0],t[1]]:[t[1],t[0]]);S.nova=S.ch.length-1}
 if(S.ch.length==1)S.nova=0;
 S.pass=0;const pts=somaPontas();
 if(pts>0&&pts%5==0){S.sc[s]+=pts;ev('ponto',s,pts);S.msg=S.nomes[s]+' fez '+pts+' pontos!'}else{ev('jogou',s);S.msg=''}
 if(S.sc[s]>=META){S.fim={w:s,ganho:0,tipo:'meta'};S.acabou=s;S.win=s;ev('fim',s);return}
 if(!S.h[s].length){fimRodada(s,'bateu');return}
 S.vez=1-s}
function fimRodada(w,tipo){
 if(tipo=='trancou'){const a=somaMao(S.h[0]),b=somaMao(S.h[1]);w=a<b?0:b<a?1:-1}
 let ganho=0;if(w>=0){ganho=Math.floor(somaMao(S.h[1-w])/5)*5;S.sc[w]+=ganho}
 S.fim={w,ganho,tipo};S.win=w>=0?w:S.vez;
 if(w>=0&&S.sc[w]>=META)S.acabou=w;
 ev('fim',w,ganho)}
function marcaFalta(s){const p=pontas();if(!p||!S.falta)return;p.forEach(v=>{if(!S.falta[s].includes(v))S.falta[s].push(v)})}
function act(s,a){if(!S)return;
 if(a.t=='prox'){if(!S.fim||S.acabou>=0)return;novaRodada();return depois()}
 if(a.t=='novo'){if(S.acabou<0)return;const n=S.nomes;novoJogo(n[0],n[1]);return depois()}
 if(S.fim||S.vez!=s)return;
 if(a.t=='j'){const t=S.h[s][a.i];if(!t)return;const ls=lados(t);if(!ls.includes(a.l))return;jogar(s,a.i,a.l)}
 else if(a.t=='c'){if(podeJogar(s)||!S.pile.length)return;marcaFalta(s);S.h[s].push(S.pile.pop());ev('compra',s);S.msg=S.nomes[s]+' comprou do dorme'}
 else if(a.t=='p'){if(podeJogar(s)||S.pile.length)return;marcaFalta(s);S.pass++;ev('passa',s);S.msg=S.nomes[s]+' passou';if(S.pass>=2){fimRodada(-1,'trancou')}else S.vez=1-s}
 depois()}
function depois(){if(modo=='host'&&conn&&conn.open)conn.send({t:'st',S});render();if(modo=='cpu')agendaCPU()}

/* ---------- ROBÔ ---------- */
function agendaCPU(){clearTimeout(cpuT);if(!S||S.fim||S.vez!=1)return;cpuT=setTimeout(cpuJoga,S.pile.length&&!podeJogar(1)?650:1100)}
function simula(ch,t,l){ch=ch.slice();if(!ch.length)ch.push(t);else if(l=='L'){const L=ch[0][0];ch.unshift(t[1]==L?t:[t[1],t[0]])}else{const R=ch[ch.length-1][1];ch.push(t[0]==R?t:[t[1],t[0]])}return ch}
function ptsCh(ch){const o=S.ch;S.ch=ch;const p=somaPontas();S.ch=o;return p%5==0&&p>0?p:0}
function risco(ch,mao,filtra){const vis={};ch.concat(mao).forEach(t=>vis[Math.min(t[0],t[1])+'-'+Math.max(t[0],t[1])]=1);
 const L=ch[0][0],R=ch[ch.length-1][1],fal=(S.falta&&S.falta[0])||[];let mx=0;
 for(let a=0;a<=6;a++)for(let b=a;b<=6;b++){if(vis[a+'-'+b])continue;if(filtra&&(fal.includes(a)||fal.includes(b)))continue;const t=[a,b];
  if(a==L||b==L)mx=Math.max(mx,ptsCh(simula(ch,t,'L')));if(a==R||b==R)mx=Math.max(mx,ptsCh(simula(ch,t,'R')))}return mx}
function cpuJoga(){if(!S||S.fim||S.vez!=1)return;const h=S.h[1],mv=[];
 h.forEach((t,i)=>lados(t).forEach(l=>{const ch=simula(S.ch,t,l);mv.push({i,l,t,ch,p:ptsCh(ch)})}));
 if(!mv.length){if(S.pile.length)act(1,{t:'c'});else act(1,{t:'p'});return}
 let best=null;
 mv.forEach(m=>{const t=m.t,dbl=t[0]==t[1],resto=h.filter((x,k)=>k!=m.i),L=m.ch[0][0],R=m.ch[m.ch.length-1][1];let sc;
  if(nivel==0)sc=Math.random()*10+(m.p&&Math.random()<.35?m.p:0);
  else if(nivel==1)sc=m.p*10+t[0]+t[1]+(dbl?4:0)+Math.random();
  else{const filtra=nivel==3,rk=risco(m.ch,resto,filtra),ctrl=resto.filter(x=>x[0]==L||x[1]==L||x[0]==R||x[1]==R).length;
   sc=m.p*10-rk*(nivel==3?8:5)+t[0]+t[1]+(dbl?5:0)+ctrl*(nivel==3?3:1.5)+Math.random();
   if(nivel==3){const fal=(S.falta&&S.falta[0])||[];if(fal.includes(L))sc+=6;if(fal.includes(R))sc+=6;if(resto.length<=2)sc+=(14-resto.reduce((a,x)=>a+x[0]+x[1],0))}}
  if(!best||sc>best.sc)best={i:m.i,l:m.l,sc}});
 act(1,{t:'j',i:best.i,l:best.l})}

function pede(a){ac();if(modo=='guest'){if(conn&&conn.open)conn.send({t:'act',a})}else act(me,a);sel=-1}
function clicaPedra(i){if(!S||S.fim||S.vez!=me)return;const t=S.h[me][i],ls=lados(t);if(!ls.length){SFX.passa();return}
 SFX.toque();const[L,R]=pontas()||[0,0];
 if(ls.length==1||(ls.length==2&&L==R&&!(S.ch.length>1&&(S.ch[0][0]==S.ch[0][1]||S.ch[S.ch.length-1][0]==S.ch[S.ch.length-1][1])))){pede({t:'j',i,l:ls[0]});return}
 sel=(sel==i?-1:i);render()}

function efeitos(){if(!S.ev||S.ev.id==ultEv)return;ultEv=S.ev.id;const e=S.ev;
 if(e.k=='jogou')SFX.clack();
 else if(e.k=='ponto'){SFX.clack();setTimeout(()=>SFX.ponto(e.pts),120);popa('+'+e.pts);vib(e.s==me?[60,40,60]:40)}

function popa(t){const p=$('pop');p.textContent=t;p.classList.remove('vai');void p.offsetWidth;p.classList.add('vai');const f=$('flash');f.classList.remove('vai');void f.offsetWidth;f.classList.add('vai');festa(1200)}
let festaT;function festa(ms){document.body.classList.add('festa');clearTimeout(festaT);festaT=setTimeout(()=>document.body.classList.remove('festa'),ms)}
function desenhaMesa(n){const m=$('mesa'),W=m.clientWidth-18,H=m.clientHeight-18,G=4;
 const w=(t,s)=>(t[0]==t[1]?s+4:2*s+6)+(s>10?G:1);let best=null;
 for(let s=30;s>=4;s=s-(s>8?1:.5)){const rows=[S.ch.map((t,i)=>i)];const cw=S.ch.reduce((x,t)=>x+w(t,s),0);best={s,rows};if(cw<=W&&2*s+6<=H)break;continue;
  const rh=rows.map(r=>r.some(i=>S.ch[i][0]==S.ch[i][1])?2*s+6:s+6),tot=rh.reduce((a,b)=>a+b,0)+6*(rows.length-1);
  best={s,rows};if(tot<=H)break}
 m.style.setProperty('--s',best.s+'px');
 m.innerHTML='<div id="zb">'+best.rows.map((r,k)=>'<div class="lin'+(k%2?' inv':'')+(best.rows.length==1?' so':'')+'">'+r.map(i=>{const t=S.ch[i],a=k%2?t[1]:t[0],b=k%2?t[0]:t[1];return pedra(a,b,t[0]!=t[1],(i==0||i==n-1?'ponta':'')+(i==S.nova?' nova':''))}).join('')+'</div>').join('')+'</div>';aplicaZoom()}
let Z=1,TX=0,TY=0;
function aplicaZoom(){const b=$('zb');if(b)b.style.transform='translate('+TX+'px,'+TY+'px) scale('+Z+')';const k=$('zoomOk');if(k)k.classList.toggle('esc',Z<=1.01)}
function zeraZoom(){Z=1;TX=TY=0;aplicaZoom()}
(function(){const m=$('mesa');let d0=0,z0=1,p0=null,t0x=0,t0y=0,ult=0;
 const dist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
 m.addEventListener('touchstart',e=>{if(e.touches.length==2){d0=dist(e);z0=Z}else if(e.touches.length==1){p0=[e.touches[0].clientX,e.touches[0].clientY];t0x=TX;t0y=TY;const a=Date.now();if(a-ult<300)zeraZoom();ult=a}},{passive:true});
 m.addEventListener('touchmove',e=>{if(e.touches.length==2&&d0){Z=Math.max(1,Math.min(5,z0*dist(e)/d0));if(Z<=1){TX=TY=0}aplicaZoom()}else if(e.touches.length==1&&p0&&Z>1){TX=t0x+e.touches[0].clientX-p0[0];TY=t0y+e.touches[0].clientY-p0[1];aplicaZoom()}},{passive:true});
 m.addEventListener('touchend',e=>{if(e.touches.length<2)d0=0;if(!e.touches.length)p0=null},{passive:true});
 m.addEventListener('wheel',e=>{e.preventDefault();Z=Math.max(1,Math.min(5,Z*(e.deltaY<0?1.1:.9)));if(Z<=1)TX=TY=0;aplicaZoom()},{passive:false});
})();

 $('nOp').textContent=(modo=='cpu'?'🤖 ':'👤 ')+N[op];$('nEu').textContent='⭐ '+N[me];
 $('pOp').textContent=S.sc[op];$('pEu').textContent=S.sc[me];

 const n=S.ch.length,sz=n<=6?27:n<=10?23:n<=14?20:n<=20?17:14;

 $('mao').innerHTML=S.h[me].map((t,i)=>pedra(t[0],t[1],false,(minha?(lados(t).length?'ok':'no'):'')+(i==sel?' sel':'')).replace('class="p','onclick="clicaPedra('+i+')" class="p')).join('');
 $('btCompra').classList.toggle('esc',!(minha&&!pode&&S.pile.length));$('btPassa').classList.toggle('esc',!(minha&&!pode&&!S.pile.length));
 $('lados').classList.toggle('esc',!(minha&&sel>=0));
 if(minha&&sel>=0&&S.h[me][sel]){const ls=lados(S.h[me][sel]);$('btL').style.display=ls.includes('L')?'':'none';$('btR').style.display=ls.includes('R')?'':'none';$('btL').textContent='◀ Esquerda ('+pp[0]+')';$('btR').textContent='Direita ('+pp[1]+') ▶'}
 efeitos();
 if(S.fim){const f=S.fim,w=f.w;let h;
  if(S.acabou>=0){h='<h2>'+(S.acabou==me?'🏆 VOCÊ VENCEU!':'😵 '+N[S.acabou]+' venceu!')+'</h2><p style="font-size:22px">'+N[me]+' '+S.sc[me]+' x '+S.sc[op]+' '+N[op]+'</p>'+
    (modo=='guest'?'<p>Esperando o dono da sala...</p>':'<button onclick="pede({t:\'novo\'})">🔁 Jogar de novo</button>')+'<button class="sec" onclick="sair()">Menu</button>'}
  else{h='<h2>'+(w<0?'🔒 Trancou! Empate':(f.tipo=='bateu'?(w==me?'🎉 Você bateu!':N[w]+' bateu!'):'🔒 Trancou! '+(w==me?'Você ganhou':N[w]+' ganhou')))+'</h2>'+
    (w>=0?'<p style="font-size:24px;color:#fbbf24;font-weight:900">+'+f.ganho+' pontos</p>':'')+
    '<p>Placar: '+N[me]+' '+S.sc[me]+' x '+S.sc[op]+' '+N[op]+'<br><small>Pedras de '+N[op]+': '+S.h[op].map(t=>t[0]+'-'+t[1]).join(', ')+'</small></p>'+
    (modo=='guest'?'<p>Esperando o dono da sala...</p>':'<button onclick="pede({t:\'prox\'})">▶ Próxima rodada</button>')}
  ov(h)}else fechaOv()}

let CHATN=0,AUDRX={},GRV=null;
function emRede(){return conn&&conn.open}
function abreChat(){$('chatBox').classList.remove('esc');CHATN=0;$('chatN').classList.add('esc');$('avisoMsg').classList.add('esc');$('chatLista').scrollTop=1e6}
function fechaChat(){$('chatBox').classList.add('esc')}
function poeMsg(nome,html,eu){const d=document.createElement('div');d.className='ms'+(eu?' eu':'');d.innerHTML='<b>'+(eu?'Você':esc(nome))+':</b> '+html;$('chatLista').appendChild(d);$('chatLista').scrollTop=1e6;
 if(!eu&&$('chatBox').classList.contains('esc')){CHATN++;$('chatN').textContent=CHATN;$('chatN').classList.remove('esc');const v=$('avisoMsg');v.innerHTML='💬 '+esc(nome)+': '+(html.indexOf('<audio')>=0?'🎤 áudio':html);v.classList.remove('esc');clearTimeout(v._t);v._t=setTimeout(()=>v.classList.add('esc'),6000);SFX.passa&&SFX.passa()}}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function nomeEu(){return S?S.nomes[me]:meuNome()}
function mandaMsg(){const i=$('chatIn'),m=i.value.trim().slice(0,140);if(!m||!emRede())return;conn.send({t:'msg',nome:nomeEu(),m});poeMsg('',esc(m),true);i.value=''}
function recebeMsg(d){poeMsg(String(d.nome||'Amigo').slice(0,20),esc(String(d.m||'').slice(0,140)),false)}
function audHtml(url,auto){return '<audio controls src="'+url+'"'+(auto?' autoplay':'')+'></audio>'}
function recebeAud(d){const a=AUDRX[d.id]||(AUDRX[d.id]={p:[],n:0});if(a.p[d.q]==null){a.p[d.q]=d.d;a.n++}if(a.n===d.tot){delete AUDRX[d.id];poeMsg(String(d.nome||'Amigo').slice(0,20),audHtml(a.p.join(''),true),false)}}
function mimeA(){if(!window.MediaRecorder)return null;for(const m of['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'])if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))return m;return ''}
async function gravaIni(e){e&&e.preventDefault();if(GRV||!emRede())return;const mime=mimeA();if(mime===null){alert('Este aparelho não grava áudio.');return}
 let st,prop=false;const t=MIC&&MIC.getAudioTracks()[0];if(t&&t.readyState=='live'){st=new MediaStream([t.clone()])}else{try{st=await navigator.mediaDevices.getUserMedia({audio:true});prop=true}catch(x){alert('Libere o microfone pro app.');return}}
 const g=GRV={st,ch:[],t0:Date.now()};try{g.rec=mime?new MediaRecorder(st,{mimeType:mime}):new MediaRecorder(st)}catch(x){GRV=null;return}
 g.rec.ondataavailable=ev=>{if(ev.data&&ev.data.size)g.ch.push(ev.data)};
 g.rec.onstop=()=>{st.getTracks().forEach(k=>k.stop());const dur=(Date.now()-g.t0)/1000;if(dur<0.6||!g.ch.length)return;const b=new Blob(g.ch,{type:g.rec.mimeType||'audio/webm'});const r=new FileReader();r.onload=()=>enviaAud(r.result);r.readAsDataURL(b)};
 g.rec.start();$('btGrava').classList.add('rec');$('btGrava').textContent='⏺';vib(30);g.lim=setTimeout(gravaFim,30000)}
function gravaFim(){const g=GRV;if(!g)return;GRV=null;clearTimeout(g.lim);try{g.rec.stop()}catch(x){}$('btGrava').classList.remove('rec');$('btGrava').textContent='🎤'}
function enviaAud(url){if(!emRede())return;const id=Date.now()+''+Math.random(),N=12000,tot=Math.ceil(url.length/N),nome=nomeEu();for(let q=0;q<tot;q++)conn.send({t:'aud',id,q,tot,nome,d:url.slice(q*N,(q+1)*N)});poeMsg('',audHtml(url,false),true)}
(function(){const b=$('btGrava');b.addEventListener('touchstart',gravaIni,{passive:false});b.addEventListener('touchend',e=>{e.preventDefault();gravaFim()});b.addEventListener('touchcancel',gravaFim);b.addEventListener('mousedown',gravaIni);b.addEventListener('mouseup',gravaFim);b.addEventListener('mouseleave',()=>{if(GRV)gravaFim()})})();
function tMic(){if(!MIC)return;const t=MIC.getAudioTracks()[0];if(!t)return;t.enabled=!t.enabled;$('btMic').textContent=t.enabled?'🎤':'🔇'}
function tCam(){if(!MIC)return;const t=MIC.getVideoTracks()[0];if(!t)return;t.enabled=!t.enabled;$('btCam').textContent=t.enabled?'📷':'🚫'}
function paraMidia(){MP=null;try{call&&call.close()}catch(e){}call=null;if(MIC)MIC.getTracks().forEach(t=>t.stop());MIC=null;['meVid','opVid'].forEach(v=>{$(v).srcObject=null;$(v).classList.add('esc');$(v).classList.remove('big')});['btMic','btCam','btOuvir','btChat'].forEach(b=>$(b).classList.add('esc'));const sa=$('somAmigo');sa.srcObject=null;fechaChat();$('chatLista').innerHTML='';$('avisoMsg').classList.add('esc')}
window.addEventListener('popstate',()=>{if(S&&!$('jogo').classList.contains('esc')){try{history.pushState({j:1},'')}catch(e){}pedeSair()}});
function fechaRede(){try{conn&&conn.close()}catch(e){}try{peer&&peer.destroy()}catch(e){}conn=null;peer=null;paraMidia()}
function codigo(){const L='ABCDEFGHJKLMNPQRSTUVWXYZ';let c='';for(let i=0;i<4;i++)c+=L[Math.floor(Math.random()*L.length)];return c}
async function criarSala(){ac();if(!window.Peer){alert('Precisa de internet pra jogar com o amigo.');return}
 fechaRede();const cod=codigo(),nm=meuNome();codAtual=cod;modo='host';me=0;$('codTxt').textContent=cod;$('stSala').textContent='Esperando o amigo entrar...';mostra('m3');pegaMidia();
 peer=new Peer('domduelo-'+cod,{config:ICE});
 peer.on('error',e=>{if(e.type=='unavailable-id'){fechaRede();criarSala()}else $('stSala').textContent='Erro de conexão: '+e.type});
 peer.on('connection',c=>{if(conn&&conn.open){c.close();return}conn=c;
  c.on('data',d=>{if(d.t=='ola'){novoJogo(nm,d.nome||'Amigo');abreJogo();depois();chama(c.peer)}else if(d.t=='act')act(1,d.a);else if(d.t=='msg')recebeMsg(d);else if(d.t=='aud')recebeAud(d);else if(d.t=='semvoz')chama(c.peer)});
  c.on('close',()=>{if(S){alert('Seu amigo saiu da sala.');sair()}})})}
let entrando=false;async function entrarSala(){if(entrando)return;entrando=true;setTimeout(()=>entrando=false,3000);ac();if(!window.Peer){alert('Precisa de internet pra jogar com o amigo.');return}
 const cod=($('codIn').value||'').trim().toUpperCase();if(cod.length!=4){entrando=false;alert('O código tem 4 letras.');return}
 fechaRede();modo='guest';me=1;const nm=meuNome();codAtual=cod;await pegaMidia();
 peer=new Peer({config:ICE});
 peer.on('call',async c=>{await pegaMidia();c.answer(MIC||vazio());ligaCall(c)});
 peer.on('error',e=>{alert(e.type=='peer-unavailable'?'Sala não encontrada. Confira o código.':'Erro de conexão: '+e.type);volta()});
 peer.on('open',()=>{conn=peer.connect('domduelo-'+cod,{reliable:true});
  conn.on('open',()=>conn.send({t:'ola',nome:nm}));
  conn.on('data',d=>{if(d.t=='st'){S=d.S;if($('jogo').classList.contains('esc'))abreJogo();sel=-1;render()}else if(d.t=='msg')recebeMsg(d);else if(d.t=='aud')recebeAud(d)});
  conn.on('close',()=>{if(S){alert('O dono da sala saiu.');sair()}})})}

(function(){const q=new URLSearchParams(location.search).get('sala');if(q&&q.length==4){try{history.replaceState(null,'',location.pathname)}catch(e){}$('capa').classList.add('sai');$('menu').classList.remove('esc');mostra('m2');$('codIn').value=q.toUpperCase();setTimeout(entrarSala,500)}})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js');
</script>
