<!DOCTYPE html>
<html lang="pt-br"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a14"><title>TudoOkê</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<script src="https://www.youtube.com/iframe_api"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box} body{margin:0;background:#0a0a14;color:#fff;font-family:Arial;overflow:hidden}
#topo{padding:12px;background:#111;display:flex;gap:8px;align-items:center;border-bottom:2px solid #ff0040;flex-wrap:wrap}
#topo form{flex:1;display:flex;gap:8px;min-width:240px}
#topo input{flex:1;padding:14px;border-radius:10px;border:2px solid #ff0040;background:#000;color:#fff;font-size:16px}
.btn{background:#ff0040;color:#fff;border:none;padding:12px 18px;border-radius:10px;font-weight:bold;cursor:pointer;font-size:15px}
.btn:focus-visible,.btn:focus,.item:focus-visible,.item:focus,#topo input:focus{outline:4px solid #ffaa00;outline-offset:2px}
#layout{display:flex;height:calc(100vh - 70px)}
#lista{width:35%;background:#111;overflow:auto;padding:8px;border-right:2px solid #222}
.aviso{padding:20px;opacity:0.6}
.item{padding:12px;background:#1a1a2a;border-radius:10px;margin-bottom:8px;cursor:pointer;display:flex;gap:10px;align-items:center}
.item:hover,.item:focus,.item.ativo{background:#2a2a4a} .item img{width:80px;height:50px;border-radius:6px;object-fit:cover;flex-shrink:0}
.item .meta{font-size:11px;opacity:0.6}
#player-area{flex:1;display:flex;flex-direction:column;background:#000;position:relative}
#player{width:100%;height:65%;background:#000}
#letra-box{height:20%;background:linear-gradient(#000,#1a0010);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold;text-align:center;padding:10px;text-shadow:0 0 10px #ff0040}
#placar{height:15%;background:#111;display:flex;justify-content:space-around;align-items:center;border-top:2px solid #ff0040}
.score{font-size:32px;color:#ff0040;font-weight:bold}
.barra-voz{width:60%;height:20px;background:#333;border-radius:10px;overflow:hidden}
#voz-fill{height:100%;width:0%;background:linear-gradient(90deg,#ff0040,#ffaa00);transition:0.1s}
#tv-aviso{position:absolute;top:10px;left:10px;background:#ff0040;padding:6px 10px;border-radius:20px;font-size:12px;display:none}
#btCast{position:absolute;top:10px;right:10px;z-index:5;background:rgba(0,0,0,.7);border:2px solid #fff;display:none}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;border:2px solid #ff0040;padding:10px 16px;border-radius:12px;display:none;z-index:50}
@media(max-width:800px){#layout{flex-direction:column}#lista{width:100%;height:35%}#player{height:55%}#letra-box{font-size:20px}.score{font-size:24px}}
#intro{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at 50% 45%,#5b1aa8,#14002b 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:opacity .6s}
#intro.sai{opacity:0;pointer-events:none}
#iMic{font-size:min(34vmin,220px);animation:iMic 1.2s ease-in-out infinite alternate;filter:drop-shadow(0 0 30px #ff3fa4)}
@keyframes iMic{0%{transform:rotate(-14deg) translateY(0) scale(1)}100%{transform:rotate(14deg) translateY(-18px) scale(1.08)}}
#iTit{font-size:min(14vmin,110px);font-weight:900;color:#fff;letter-spacing:2px;text-shadow:0 0 18px #ff3fa4,0 0 40px #7c3aed;transform:scale(0);animation:iTit .8s 1s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes iTit{to{transform:scale(1)}}
#iSub{color:#ffd54a;font-size:min(5vmin,32px);opacity:0;animation:iSub .6s 1.8s forwards}@keyframes iSub{to{opacity:1}}
.iNota{position:absolute;bottom:-60px;font-size:min(9vmin,60px);animation:iSobe linear forwards;opacity:.9}
@keyframes iSobe{to{transform:translateY(-120vh) rotate(360deg);opacity:0}}
.iLuz{position:absolute;top:-10%;width:30vw;height:130%;background:linear-gradient(transparent,rgba(255,63,164,.25),transparent);transform-origin:top;animation:iLuz 2.4s ease-in-out infinite alternate}
@keyframes iLuz{from{transform:rotate(-25deg)}to{transform:rotate(25deg)}}
#iPula{position:absolute;bottom:4vh;color:#ccc;font-size:16px;background:transparent;border:1px solid #888}
</style></head><body>
<div id="intro" onclick="fimIntro()"><div class="iLuz" style="left:5%"></div><div class="iLuz" style="right:5%;animation-delay:1.2s"></div><div id="iMic">🎤</div><div id="iTit">TudoOkê</div><div id="iSub">Karaokê com nota</div><button id="iPula" onclick="fimIntro()">Pular ⏭</button></div>


<div id="topo">
 <form id="form-busca"><input id="busca" placeholder="Digite: Zezé - É o amor karaoke" value="karaoke sertanejo" aria-label="Buscar música"><button class="btn" type="submit">🔍 BUSCAR</button></form>
 <button class="btn" style="background:#00d4ff" onclick="iniciarMic()">🎤 ATIVAR MICROFONE</button>
 <span id="statusMic" style="font-size:12px">Mic off</span>
</div>
<div id="layout">
 <div id="lista"><div class="aviso">Digite uma música e clique em BUSCAR. O app vai buscar só versões KARAOKE do YouTube.</div></div>
 <div id="player-area">
  <div id="player"></div>
  <button id="btCast" class="btn" onclick="espelhar()">📡 Espelhar na TV</button>
  <div id="letra-box">TudoOkê - Aguardando música...</div>
  <div id="placar"><div>PONTUAÇÃO: <span class="score" id="pontos">0</span></div><div class="barra-voz"><div id="voz-fill"></div></div><div>NOTA: <span class="score" id="nota">--</span></div></div>
  <div id="tv-aviso">MODO TV BOX - Use o controle remoto</div>
 </div>
</div>
<div id="toast"></div>
<script>
let player, playerPronto=false, videoPendente=null, micAtivo=false, audioCtx, analyser, pontos=0, vozLevel=0, ultimoPonto=0;
let resultados=[], atual=-1;
const TV = new URLSearchParams(location.search).get("tv")==="1" || localStorage.getItem("tudooke_tv")==="1";
if(new URLSearchParams(location.search).get("tv")==="1") localStorage.setItem("tudooke_tv","1");
const PIPED=["https://api.piped.private.coffee","https://pipedapi.kavin.rocks","https://pipedapi.adminforge.de"];
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>e.style.display='none',3500)}
function onYouTubeIframeAPIReady(){
 player = new YT.Player('player',{height:'100%',width:'100%',playerVars:{playsinline:1, origin: window.location.origin},
  events:{onReady: ()=>{ playerPronto=true; if(videoPendente!==null) tocar(videoPendente); }, onStateChange: onPlayerState, onError: onPlayerError}});
}
function onPlayerState(e){ if(e.data==1) iniciarPontuacao(); }
function onPlayerError(e){
 if((e.data==101||e.data==150) && atual+1<resultados.length){ log("Esse vídeo não permite tocar aqui. Pulando pro próximo..."); setTimeout(()=>tocar(atual+1),1500); }
 else log("Não foi possível tocar esse vídeo. Escolha outro da lista.");
}
document.getElementById('form-busca').addEventListener('submit', e=>{ e.preventDefault(); buscar(); });
function dur(s){return s?Math.floor(s/60)+":"+String(s%60).padStart(2,"0"):""}
async function buscaVideos(termo){
 for(let i=0;i<PIPED.length;i++){
  try{let ctl=new AbortController();let tm=setTimeout(()=>ctl.abort(),9000);
   let r=await fetch(PIPED[i]+"/search?q="+encodeURIComponent(termo)+"&filter=videos",{signal:ctl.signal});clearTimeout(tm);
   if(!r.ok) continue; let j=await r.json();
   let out=(j.items||[]).filter(x=>x.url&&x.type==="stream"&&x.duration>60).slice(0,20).map(x=>{let id=(x.url.match(/v=([\w-]{11})/)||[])[1];return {id,titulo:x.title,canal:x.uploaderName||"",duracao:dur(x.duration),thumb:"https://i.ytimg.com/vi/"+id+"/mqdefault.jpg"}}).filter(v=>v.id);
   if(out.length){PIPED.unshift(PIPED.splice(i,1)[0]);return out}
  }catch(e){}
 }
 throw new Error("busca fora");
}
async function buscar(){
 let termo = document.getElementById('busca').value.trim();
 if(!termo) return;
 if(!/karaok/i.test(termo)) termo += " karaoke";
 let listaDiv = document.getElementById('lista');
 listaDiv.innerHTML = '<div class="aviso">Buscando karaokes reais do YouTube...</div>';
 try{ resultados = await buscaVideos(termo); }
 catch(e){ listaDiv.innerHTML = '<div class="aviso">Não foi possível buscar agora. Tente de novo em instantes.</div>'; return; }
 listaDiv.innerHTML = "";
 if(!resultados.length){ listaDiv.innerHTML = '<div class="aviso">Nenhum karaoke encontrado. Tente outro nome.</div>'; return; }
 resultados.forEach((v,i)=>{
  let div = document.createElement('div');
  div.className='item'; div.tabIndex=0; div.setAttribute('role','button');
  let img = document.createElement('img'); img.src=v.thumb; img.alt=""; img.loading="lazy";
  let txt = document.createElement('div');
  let b = document.createElement('b'); b.textContent = v.titulo;
  let meta = document.createElement('div'); meta.className='meta';
  meta.textContent = [v.canal, v.duracao].filter(Boolean).join(' • ');
  txt.append(b, meta); div.append(img, txt);
  div.onclick=()=>tocar(i);
  div.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); tocar(i); } };
  listaDiv.appendChild(div);
 });
}
function tocar(i){
 if(!playerPronto){ videoPendente=i; log("Carregando player..."); return; }
 videoPendente=null; atual=i;
 let v = resultados[i];
 document.querySelectorAll('.item').forEach((el,j)=>el.classList.toggle('ativo', j===i));
 player.loadVideoById(v.id);
 log("🎤 Cantando: " + v.titulo);
 pontos=0; document.getElementById('pontos').innerText="0"; document.getElementById('nota').innerText="--";
 if(!TV) document.getElementById('btCast').style.display='block';
}
function log(t){ document.getElementById('letra-box').innerText = t; }
// --- PONTUAÇÃO COM MICROFONE ---
async function iniciarMic(){
 if(micAtivo) return;
 try{
  let stream = await navigator.mediaDevices.getUserMedia({audio:true});
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  let source = audioCtx.createMediaStreamSource(stream);
  analyser = audioCtx.createAnalyser(); analyser.fftSize=256;
  source.connect(analyser);
  micAtivo=true; document.getElementById('statusMic').innerText="Mic ON - Cantando!";
  analisarVoz();
 } catch(e){ alert("Precisa permitir microfone. Na TV Box, conecte um microfone USB."); }
}
function analisarVoz(agora=0){
 if(!micAtivo) return;
 let data = new Uint8Array(analyser.frequencyBinCount);
 analyser.getByteFrequencyData(data);
 let media = data.reduce((a,b)=>a+b,0)/data.length;
 vozLevel = media;
 document.getElementById('voz-fill').style.width = Math.min(100, vozLevel) + "%";
 if(vozLevel>20 && agora-ultimoPonto>100 && player && player.getPlayerState && player.getPlayerState()==1){
  ultimoPonto = agora;
  pontos += Math.floor(vozLevel/10);
  document.getElementById('pontos').innerText = pontos;
  let nota = vozLevel>70?"A+ - SHOW!":vozLevel>40?"B - Boa!":"C - Canta mais alto!";
  document.getElementById('nota').innerText=nota;
 }
 requestAnimationFrame(analisarVoz);
}
function iniciarPontuacao(){ if(!micAtivo) document.getElementById('statusMic').innerText="Dica: Ative o microfone pra pontuar!"; }

// --- ESPELHAR: celular manda a música pra TV Box no mesmo Wi-Fi ---
var ICE={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun.relay.metered.ca:80"},{urls:"turn:global.relay.metered.ca:80",username:"6dff73deecf7b62d9ae1759e",credential:"7J1gl21x+BQziEO1"},{urls:"turn:global.relay.metered.ca:80?transport=tcp",username:"6dff73deecf7b62d9ae1759e",credential:"7J1gl21x+BQziEO1"},{urls:"turn:global.relay.metered.ca:443",username:"6dff73deecf7b62d9ae1759e",credential:"7J1gl21x+BQziEO1"},{urls:"turns:global.relay.metered.ca:443?transport=tcp",username:"6dff73deecf7b62d9ae1759e",credential:"7J1gl21x+BQziEO1"}]};

const PFX="tudooke-";
async function idRede(){try{let r=await fetch("https://api.ipify.org?format=json");let j=await r.json();let h=0,t=j.ip;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))>>>0;return PFX+"net-"+h.toString(36)}catch(e){return null}}
async function salaTV(){let id=await idRede();if(!id)return;let p=new Peer(id,{config:ICE});
 p.on("connection",c=>{c.on("data",d=>{if(d.t==="cast"&&d.v){toast("📡 Música chegando do celular!");resultados=d.lista&&d.lista.length?d.lista:[d.v];let i=Math.max(0,resultados.findIndex(x=>x.id===d.v.id));desenhaLista();tocar(i);
   if(d.s>3){let k=0,iv=setInterval(()=>{k++;try{if(player.getPlayerState()==1){player.seekTo(d.s,true);clearInterval(iv)}}catch(e){}if(k>40)clearInterval(iv)},250)}
   c.send({t:"ok"})}})});
 p.on("error",()=>{});p.on("disconnected",()=>{try{p.reconnect()}catch(e){}})}
function desenhaLista(){let q=document.getElementById('busca');let r=resultados;document.getElementById('lista').innerHTML="";resultados=r;
 r.forEach((v,i)=>{let div=document.createElement('div');div.className='item';div.tabIndex=0;div.innerHTML='<img alt=""><div><b></b><div class="meta"></div></div>';div.querySelector('img').src=v.thumb;div.querySelector('b').textContent=v.titulo;div.querySelector('.meta').textContent=[v.canal,v.duracao].filter(Boolean).join(' • ');div.onclick=()=>tocar(i);div.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tocar(i)}};document.getElementById('lista').appendChild(div)})}
async function espelhar(){let b=document.getElementById('btCast');b.textContent="📡 Procurando a TV...";let id=await idRede();
 if(!id){b.textContent="📡 Espelhar na TV";return toast("Sem internet pra procurar a TV.")}
 let p=new Peer({config:ICE}),ok=false;
 let fim=setTimeout(()=>{if(!ok){b.textContent="📡 Espelhar na TV";toast("Não achei a TV. Abra o TudoOkê TV na TV Box, no mesmo Wi-Fi.");try{p.destroy()}catch(e){}}},12000);
 p.on("error",()=>{});
 p.on("open",()=>{let c=p.connect(id,{reliable:true});
  c.on("open",()=>{let s=0;try{s=player.getCurrentTime()}catch(e){}c.send({t:"cast",v:resultados[atual],s:s,lista:resultados})});
  c.on("data",d=>{if(d.t!=="ok")return;ok=true;clearTimeout(fim);try{player.pauseVideo()}catch(e){}b.textContent="📺 Tocando na TV";toast("✅ Tocando na TV!");setTimeout(()=>{try{p.destroy()}catch(e){}},1500)})})}

if(TV || navigator.userAgent.includes('TV') || window.innerWidth>1200){
 let a=document.getElementById('tv-aviso');a.style.display='block';setTimeout(()=>a.style.display='none',5000);
}
if(TV) salaTV();
/* Abertura animada */
var INTRO_OK=false,POS_INTRO=null;
function fimIntro(){if(INTRO_OK)return;INTRO_OK=true;var i=document.getElementById("intro");i.classList.add("sai");setTimeout(function(){i.remove()},700);if(POS_INTRO){var f=POS_INTRO;POS_INTRO=null;f()}}
(function(){var i=document.getElementById("intro"),n=["🎵","🎶","🎤","⭐","🎵","🎶"];var t=setInterval(function(){if(INTRO_OK){clearInterval(t);return}var e=document.createElement("div");e.className="iNota";e.textContent=n[Math.random()*n.length|0];e.style.left=(Math.random()*92)+"%";e.style.animationDuration=(2+Math.random()*2)+"s";i.appendChild(e);setTimeout(function(){e.remove()},4200)},180);
 try{var A=new (window.AudioContext||window.webkitAudioContext)();var nt=[523,659,784,1047];nt.forEach(function(f,k){var o=A.createOscillator(),g=A.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(0,A.currentTime+k*.18);g.gain.linearRampToValueAtTime(.15,A.currentTime+k*.18+.02);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+k*.18+.5);o.connect(g);g.connect(A.destination);o.start(A.currentTime+k*.18);o.stop(A.currentTime+k*.18+.6)})}catch(e){}
 setTimeout(fimIntro,4000)})();

buscar();
if("serviceWorker" in navigator)navigator.serviceWorker.register("service-worker.js");
</script><script src="confirma-sair.js?v=1"></script><script src="voltar-pergunta.js?v=2" data-nome="TudoOkê"></script>
</body></html>
